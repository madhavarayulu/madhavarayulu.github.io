# -- Theme Options --
colorScheme = "blowfish"
defaultAppearance = "dark"
autoSwitchAppearance = true
enableA11y = false
enableSearch = true
enableCodeCopy = true
fingerprintAlgorithm = "sha512"

[typography]
  headingFont = "'Source Serif 4', Georgia, serif"
  bodyFont = "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
  codeFont = "'JetBrains Mono', 'Fira Code', monospace"
  uiFont = "'Inter', -apple-system, sans-serif"

[header]
  layout = "fixed"

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = false
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  layout = "profile"
  showRecent = true
  showRecentItems = 6
  showMoreLink = true
  showMoreLinkDest = "/posts/"

[article]
  showDate = true
  showDateUpdated = true
  showAuthor = true
  showReadingTime = true
  showReadingProgress = true
  showTableOfContents = true
  showHeadingAnchors = true
  showRelatedContent = true
  relatedContentLimit = 3
  showTaxonomies = true
  showCategories = true
  showTags = true
  showWordCount = true
  showZenMode = true
  sharingLinks = ["linkedin", "email"]
  showHero = false
  showBreadcrumbs = false
  showEdit = false
  showDraftLabel = true
  showPagination = true
  invertPagination = false

[list]
  showCards = true
  cardView = true
  showSummary = true
  groupByYear = true
  showHero = false
  showBreadcrumbs = false
  showTableOfContents = false
  orderByWeight = false
  constrainItemsWidth = false

[taxonomy]
  showTermCount = true
  showHero = false
  showBreadcrumbs = false
  showTableOfContents = false
  cardView = true

[term]
  showHero = false
  showBreadcrumbs = false
  showTableOfContents = true
  groupByYear = false
  cardView = true

[params]
  defaultSocialImage = "images/social-default.webp"

[seo]
  # metaDescriptionOrder = ["summary", "description", "site"]
