[article]
  showReadingTime = true
  showTableOfContents = true
  showRelatedContent = true
  relatedContentLimit = 3
  showDate = true
  showDateUpdated = true

[homepage]
  showRecent = true
  recentLimit = 8
  showMoreLink = true

[header]
  layout = "fixed"
  showTitle = true

[footer]
  showCopyright = true
  showThemeAttribution = false
  showAppearanceSwitcher = true

[appearance]
  colorScheme = "cairn"

[search]
  provider = "pagefind"
  showSearch = true

[analytics]
  cloudflare = true
  cloudflareToken = "YOUR_CLOUDFLARE_TOKEN"
