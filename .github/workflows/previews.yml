name: entry-previews
on:
  push:
    branches: [main]
    paths: ['posts/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Generate per-entry preview stubs
        shell: python
        run: |
          import re, html, shutil, pathlib
          SITE = 'https://madhavarayulu.github.io'
          AUTHOR = 'https://www.linkedin.com/in/madhavarayulu'
          posts = pathlib.Path('posts')
          entry = pathlib.Path('entry')
          if entry.exists():
              shutil.rmtree(entry)
          entry.mkdir()
          def excerpt(body, n=160):
              t = re.sub(r'```[\s\S]*?```', ' ', body)
              t = re.sub(r'\[([^\]]*)\]\(([^)]*)\)', r'\1', t)
              t = re.sub(r'[#>*_`~]', ' ', t)
              t = re.sub(r'\s+', ' ', t).strip()
              return (t[:n].rsplit(' ', 1)[0] + '…') if len(t) > n else t
          for f in sorted(posts.glob('*.md')):
              raw = f.read_text(encoding='utf-8', errors='replace').lstrip()
              meta = {}
              m = re.match(r'^---\s*\n([\s\S]*?)\n---', raw)
              if m:
                  for line in m.group(1).splitlines():
                      kv = re.match(r'^(\w+)\s*:\s*(.*)$', line)
                      if kv:
                          meta[kv.group(1).lower()] = kv.group(2).strip()
                  raw = raw[m.end():]
              if re.match(r'(?i)^(true|yes|1)$', meta.get('draft', '')):
                  continue
              slug = f.stem
              title = meta.get('title', slug)
              desc = excerpt(raw)
              image = SITE + '/cairn-card-wide.png'
              date_tag = f'<meta property="article:published_time" content="{meta.get("date","")}">\n' if meta.get('date') else ''
              author_tag = f'<meta property="article:author" content="{AUTHOR}">\n<meta name="author" content="Madhava Rayulu">\n' if AUTHOR else ''
              page = (
                  '<!DOCTYPE html>\n'
                  '<html lang="en"><head>\n'
                  '<meta charset="UTF-8">\n'
                  f'<title>{html.escape(title)} · Cairn</title>\n'
                  f'<meta property="og:title" content="{html.escape(title)} — Cairn">\n'
                  f'<meta property="og:description" content="{html.escape(desc)}">\n'
                  '<meta property="og:type" content="article">\n'
                  f'<meta property="og:url" content="{SITE}/entry/{slug}/">\n'
                  f'<meta property="og:image" content="{image}">\n'
                  '<meta property="og:image:width" content="1200">\n'
                  '<meta property="og:image:height" content="628">\n'
                  '<meta property="og:image:alt" content="A cairn — six stacked stones with a terracotta capstone">\n'
                  '<meta name="twitter:card" content="summary_large_image">\n'
                  + date_tag + author_tag
                  + f'<meta http-equiv="refresh" content="0; url=/#/entry/{slug}">\n'
                  f'<script>location.replace("/#/entry/{slug}")</script>\n'
                  '</head><body style="font-family:monospace;background:#F2EDE2;color:#26221B;padding:2rem">\n'
                  f'<p>Opening <a href="/#/entry/{slug}" style="color:#C1502E">{html.escape(title)}</a> …</p>\n'
                  '</body></html>\n'
              )
              d = entry / slug
              d.mkdir()
              (d / 'index.html').write_text(page, encoding='utf-8')
      - name: Commit stubs
        run: |
          git config user.name "cairn-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add entry
          git diff --cached --quiet || (git commit -m "refresh entry previews" && git push)
