---
title: Why Cairn
date: 2026-01-09
tags: notes, philosophy
verified: 25A
---
Above the treeline the trail stops being a trail. It becomes a suggestion — rock, fog, the occasional patch of gravel that might be a path. What keeps you from wandering off is a pile of stones somebody stacked before you arrived.

Nobody owns a cairn. Nobody collects a fee. A stranger you will never meet spent twenty minutes of their one life balancing rocks so that you, specifically, would not get lost.

That seemed like the right shape for a blog.

So this is a cairn too — smaller, slower, made of words instead of granite. Field notes, gotchas, half-finished thoughts, stacked one on top of another as they come. If one of them ever marks the trail for you, the pile has done its job.

> The next storm will knock some of it down. That is fine. That is what stones are for — restacking.

        return isNaN(d) ? "—" : d.getFullYear();
      };
      const rt = (t) => {
        const w = String(t || "").trim().split(/\s+/).filter(Boolean).length;
        return Math.max(1, Math.round(w / 220)) + " min read";
      };

      function excerpt(md, n = 165) {
        const t = String(md || "")
          .replace(/^\s*---[\s\S]*?---/, "")
          .replace(/```[\s\S]*?```/g, " ")
          .replace(/\[([^\]]*)\]\([^)]*\)/g, "$1")
          .replace(/[#>*_`~]/g, " ")
          .replace(/\s+/g, " ")
          .trim();
        return t.length > n ? t.slice(0, n).replace(/\s+\S*$/, "") + "…" : t;
      }

      function parsePost(raw, slug) {
        raw = String(raw).replace(/^\uFEFF/, "").replace(/^\s+/, "");
        const meta = { title: slug, date: "", tags: [], draft: false, series: "", part: 0, verified: "" };
        let body = raw;
        const m = raw.match(/^---\r?\n([\s\S]*?)\r?\n---\s*(\n|$)/);
        if (m) {
          body = raw.slice(m[0].length);
          m[1].split(/\r?\n/).forEach((line) => {
            const kv = line.match(/^(\w+)\s*:\s*(.*)$/);
            if (!kv) return;
            const k = kv[1].toLowerCase(),
              v = kv[2].trim();
            if (k === "title") meta.title = v;
            else if (k === "date") meta.date = v;
            else if (k === "tags") meta.tags = v.split(",").map((s) => s.trim()).filter(Boolean);
            else if (k === "draft") meta.draft = /^(true|yes|1)$/i.test(v);
            else if (k === "series") meta.series = v;
            else if (k === "part") meta.part = parseInt(v, 10) || 0;
            else if (k === "verified") meta.verified = v;
          });
        }
        return {
          slug,
          ...meta,
          dateMs: meta.date ? new Date(meta.date).getTime() || 0 : 0,
          ex: excerpt(body),
          body: body.trim(),
        };
      }

      const collectSamples = () =>
        [...document.querySelectorAll('script[type="text/markdown"]')].map((el) =>
          parsePost(el.textContent, el.dataset.slug)
        );

      async function fetchPosts() {
        try {
          const res = await fetch("/posts.json");
          if (res.ok) {
            const data = await res.json();
            return data.map((p) => ({
              ...p,
              dateMs: p.date ? new Date(p.date).getTime() || 0 : 0,
              ex: p.excerpt,
              body: p.raw,
            }));
          }
        } catch (_) {}

        const { owner, repo, branch } = CONFIG;
        const api = `https://api.github.com/repos/${owner}/${repo}/git/trees/${branch}?recursive=1`;
        const r = await fetch(api);
        if (!r.ok) throw new Error("github " + r.status);
        const j = await r.json();
        const paths = ((j || {}).tree || [])
          .filter((t) => t.type === "blob" && /^posts\/[^/]+\.md$/.test(t.path))
          .map((t) => t.path);
        if (!paths.length) throw new Error("no posts");
        const base = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/`;
        return Promise.all(
          paths.map(async (path) => {
            const text = await (await fetch(base + path)).text();
            return parsePost(text, path.slice(6, -3));
          })
        );
      }

      function cairnSVG(entries, o = {}) {
        const uid = o.uid || "c" + Math.random().toString(36).slice(2, 7);
        const RAMP = ["#2B2520", "#38312A", "#4A4138", "#5E5347", "#746758"];
        const shown = entries.slice(0, 6).reverse();
        const n = shown.length;
        if (!n) return "";
        const S = [
          { rx: 98, ry: 26, cy: 236, dx: 2, t: 0 },
          { rx: 82, ry: 24, cy: 197, dx: -3, t: -2 },
          { rx: 67, ry: 21, cy: 162, dx: 3, t: 2 },
          { rx: 51, ry: 18, cy: 131, dx: -2, t: -2.5 },
          { rx: 37, ry: 14, cy: 105, dx: 2, t: 3 },
          { rx: 26, ry: 11, cy: 84, dx: -2, t: -8 },
        ];
        const slots = [];
        if (n === 1) slots.push({ rx: 62, ry: 21, cy: 233, dx: 0, t: -5 });
        else {
          slots.push(S[0]);
          for (let i = 1; i < n - 1; i++) slots.push(S[i]);
          slots.push(S[5]);
        }

        const defs = [
          `<filter id="${uid}b2" x="-60%" y="-300%" width="220%" height="700%"><feGaussianBlur stdDeviation="2.6"/></filter>`,
          `<filter id="${uid}b6" x="-50%" y="-500%" width="200%" height="1100%"><feGaussianBlur stdDeviation="5"/></filter>`,
        ];
        const out = [
          `<ellipse cx="160" cy="266" rx="116" ry="10" fill="#000" opacity=".38" filter="url(#${uid}b6)"/>`,
          `<ellipse cx="160" cy="264" rx="66" ry="5" fill="#E06D44" opacity=".16" filter="url(#${uid}b2)"/>`,
        ];

        for (let i = 0; i < n; i++) {
          const s = slots[i],
            cap = i === n - 1,
            cx = 160 + s.dx,
            cy = s.cy;
          const col = cap ? "#E06D44" : RAMP[Math.min(i, 4)];
          if (i > 0)
            out.push(
              `<ellipse cx="${cx}" cy="${cy + s.ry - 2}" rx="${(s.rx * 0.92).toFixed(1)}" ry="6" fill="#000" opacity=".28" filter="url(#${uid}b2)"/>`
            );
          defs.push(
            `<radialGradient id="${uid}h${i}" cx=".36" cy=".18" r="1"><stop offset="0" stop-color="#FFE9CE" stop-opacity="${cap ? ".5" : ".32"}"/><stop offset=".6" stop-color="#FFE9CE" stop-opacity="0"/></radialGradient>`,
            `<linearGradient id="${uid}o${i}" x1="0" y1="0" x2="0" y2="1"><stop offset=".55" stop-color="#0B0705" stop-opacity="0"/><stop offset="1" stop-color="#0B0705" stop-opacity=".42"/></linearGradient>`,
            `<clipPath id="${uid}c${i}"><ellipse cx="${cx}" cy="${cy}" rx="${s.rx}" ry="${s.ry}"/></clipPath>`
          );
          const stroke = cap
            ? 'stroke="#7A2F17" stroke-opacity=".55" stroke-width="1"'
            : 'stroke="#0B0705" stroke-opacity=".3" stroke-width="1"';
          out.push(
            `<g class="st" data-slug="${esc(shown[i].slug)}" data-title="${esc(shown[i].title)}" tabindex="0" role="link" aria-label="${esc(shown[i].title)}" style="animation-delay:${i * 65}ms">` +
              `<g transform="rotate(${s.t} ${cx} ${cy})">` +
              `<ellipse class="stbody" cx="${cx}" cy="${cy}" rx="${s.rx}" ry="${s.ry}" fill="${col}" ${stroke}/>` +
              `<g clip-path="url(#${uid}c${i})">` +
              `<ellipse cx="${cx}" cy="${cy}" rx="${s.rx}" ry="${s.ry}" fill="url(#${uid}h${i})"/>` +
              `<ellipse cx="${cx}" cy="${cy}" rx="${s.rx}" ry="${s.ry}" fill="url(#${uid}o${i})"/>` +
              `</g></g></g>`
          );
        }
        return `<svg class="cairn" viewBox="0 0 320 282" role="group" aria-label="Recent entries stacked as stones"><defs>${defs.join("")}</defs>${out.join("")}</svg>`;
      }

      function bindCairn(root, cap) {
        if (!root) return;
        const reset = () => {
          if (cap) cap.textContent = cap.dataset.def || "";
        };
        const show = (g) => {
          if (cap && g) cap.textContent = "↳ " + g.dataset.title;
        };
        root.addEventListener("mouseover", (e) => {
          const g = e.target.closest("g.st");
          if (g) show(g);
        });
        root.addEventListener("mouseleave", reset);
        root.addEventListener("focusin", (e) => {
          const g = e.target.closest("g.st");
          if (g) show(g);
        });
        root.addEventListener("focusout", reset);
        root.addEventListener("click", (e) => {
          const g = e.target.closest("g.st");
          if (g && g.dataset.slug) navigate(`/entry/${encodeURIComponent(g.dataset.slug)}/`);
        });
        root.addEventListener("keydown", (e) => {
          const g = e.target.closest("g.st");
          if (g && (e.key === "Enter" || e.key === " ")) {
            e.preventDefault();
            if (g.dataset.slug) navigate(`/entry/${encodeURIComponent(g.dataset.slug)}/`);
          }
        });
      }

      function enhanceArticleDOM() {
        const prose = $(".entry-prose");
        if (!prose) return;

        prose.querySelectorAll("blockquote").forEach((bq) => {
          const firstP = bq.querySelector("p");
          if (!firstP) return;
          const m = firstP.innerHTML.match(/^\s*\[!(NOTE\vert{}TIP\vert{}WARNING\vert{}IMPORTANT)\]\s*(?:<br\s*\/?>|\n)?/i);
          if (m) {
            const kind = m[1].toUpperCase();
            bq.classList.add("callout");
            firstP.innerHTML = firstP.innerHTML.slice(m[0].length);
            const title = document.createElement("div");
            title.className = "callout-title";
            title.innerHTML = `<span class="ms-icon" style="font-size:15px">info</span> ${kind}`;
            bq.prepend(title);
          }
        });

        prose.querySelectorAll("pre").forEach((pre) => {
          if (pre.parentElement.classList.contains("code-block-wrap")) return;
          const code = pre.querySelector("code");
          const langMatch = code && code.className.match(/language-(\w+)/);
          const lang = langMatch ? langMatch[1] : "snippet";

          const wrap = document.createElement("div");
          wrap.className = "code-block-wrap";
          const bar = document.createElement("div");
          bar.className = "code-block-bar";
          bar.innerHTML = `<span>${esc(lang)}</span><button class="copy-code-btn" type="button">Copy code</button>`;
          pre.parentNode.insertBefore(wrap, pre);
          wrap.appendChild(bar);
          wrap.appendChild(pre);

          bar.querySelector(".copy-code-btn").addEventListener("click", async function () {
            const raw = code ? code.textContent : pre.textContent;
            try {
              await navigator.clipboard.writeText(raw);
              this.textContent = "✓ Copied";
              setTimeout(() => (this.textContent = "Copy code"), 1800);
            } catch (_) {}
          });
        });

        const headings = [...prose.querySelectorAll("h2, h3")];
        const tocSlot = $("#tocSlot");
        if (tocSlot && headings.length >= 2) {
          const items = headings.map((h, ix) => {
            if (!h.id) {
              h.id =
                h.textContent
                  .toLowerCase()
                  .replace(/[^a-z0-9]+/g, "-")
                  .replace(/(^-|-$)/g, "") || "sec-" + ix;
            }
            const lvl = h.tagName.toLowerCase();
            return `<li><a class="toc-link toc-${lvl}" href="#${esc(h.id)}" data-target="${esc(h.id)}">${esc(h.textContent)}</a></li>`;
          });
          tocSlot.innerHTML = `<div class="toc-box m-card"><div class="m-label">On this page</div><ul class="toc-list">${items.join("")}</ul></div>`;

          if (tocObserver) tocObserver.disconnect();
          tocObserver = new IntersectionObserver(
            (entries) => {
              entries.forEach((entry) => {
                if (entry.isIntersecting) {
                  tocSlot.querySelectorAll(".toc-link").forEach((a) => {
                    a.classList.toggle("active", a.dataset.target === entry.target.id);
                  });
                }
              });
            },
            { rootMargin: "-80px 0px -70% 0px" }
          );
          headings.forEach((h) => tocObserver.observe(h));
        }

        const CAN_SHARE = typeof navigator.share === "function" && matchMedia("(pointer: coarse)").matches;
        document.querySelectorAll(".js-share").forEach((b) => {
          if (CAN_SHARE) b.innerHTML = `<span class="ms-icon">share</span> Share`;
          b.addEventListener("click", async () => {
            const url = b.dataset.url || location.href;
            if (CAN_SHARE) {
              try {
                await navigator.share({ title: b.dataset.title || document.title, url });
              } catch (_) {}
              return;
            }
            try {
              await navigator.clipboard.writeText(url);
            } catch (_) {}
            toast("Link copied to clipboard");
          });
        });
      }

              ${seriesBlock}

              <nav class="nav-row">
                ${
                  newer
                    ? `<a class="nav-link prev" href="/entry/${encodeURIComponent(newer.slug)}/" data-nav>
                        <span class="nav-label">← Newer Note</span>
                        <span class="nav-title">${esc(newer.title)}</span>
                      </a>`
                    : `<div></div>`
                }
                ${
                  older
                    ? `<a class="nav-link next" href="/entry/${encodeURIComponent(older.slug)}/" data-nav>
                        <span class="nav-label">Older Note →</span>
                        <span class="nav-title">${esc(older.title)}</span>
                      </a>`
                    : `<div></div>`
                }
              </nav>
            </div>

            <aside class="margin-col only-desktop art-margin">
              <div class="m-sticky">
                <div class="m-card">
                  <div class="m-label">Field Note Specs</div>
                  <div class="nrow"><span class="nk">Date</span><span class="nv">${fmt(p.date)}</span></div>
                  <div class="nrow"><span class="nk">Read</span><span class="nv">${rt(p.body)}</span></div>
                  <div class="nrow"><span class="nk">Stone</span><span class="nv">#${String(POSTS.length - i).padStart(2, "0")} in pile</span></div>
                  ${p.verified ? `<div class="nrow"><span class="nk">Release</span><span class="nv" style="color:var(--md-sys-color-secondary)">● ${esc(p.verified)}</span></div>` : ""}
                  <div style="margin-top:16px">
                    <button class="share-btn js-share" style="width:100%" data-url="${esc(cleanUrl)}" data-title="${esc(p.title)}">
                      <span class="ms-icon">link</span> Copy link
                    </button>
                  </div>
                </div>
                <div id="tocSlot"></div>
              </div>
            </aside>
          </div>`;

        enhanceArticleDOM();
      }

      function renderAbout() {
        setActiveNav("about");
        document.title = "About · " + CONFIG.title;
        const capDef = `${POSTS.length} ${POSTS.length === 1 ? "stone" : "stones"} and counting`;
        const why = POSTS.find((x) => x.slug === "why-cairn");

        view.innerHTML = `
          <div class="page-grid">
            <div class="main-col">
              <div class="page-head">
                <span class="eyebrow"><span class="eyebrow-dot"></span>Trailhead</span>
                <h1 class="page-title">About</h1>
              </div>
              <div class="prose">
                <p>I am an <strong>Oracle Fusion Finance functional consultant</strong>.</p>
                <p>My work is to bridge the gap between business needs and system capabilities — guiding implementations, designing financial processes, and configuring solutions that hold up in production.</p>
                <p><strong>Cairn</strong> is a collection of field notes from that journey. It covers the practical realities of deployments, quarterly release cycles, Subledger Accounting (SLA) rules, and the edge cases that official documentation misses.</p>
                <p>Client identities remain strictly confidential. The insights, however, are left here for anyone walking the same trail.</p>
                ${why ? `<p><a href="/entry/why-cairn/" data-nav>Read "Why Cairn?" →</a></p>` : ""}
              </div>
              <div style="margin-top:44px;padding:20px;border-radius:var(--radius-md);background:var(--md-sys-color-surface-container-low);border:1px dashed var(--md-sys-color-outline-variant);font-size:13px;color:var(--md-sys-color-on-surface-variant)">
                <strong>Disclaimer:</strong> This site is an independent project and is not affiliated with, endorsed by, or sponsored by Oracle Corporation. Oracle and related trademarks are the property of their respective owners. Content is based on personal implementation experience and does not constitute official documentation.
              </div>
            </div>
            <aside class="margin-col m-home">
              <div class="m-sticky m-card">
                <div id="abCairnD">${cairnSVG(POSTS, { uid: "aba" })}</div>
                <div class="cairn-cap" id="abCapD" data-def="${esc(capDef)}">${esc(capDef)}</div>
              </div>
            </aside>
          </div>`;

        bindCairn($("#abCairnD"), $("#abCapD"));
      }

      const cmdModal = $("#cmdModal"),
        cmdInput = $("#cmdInput"),
        cmdResults = $("#cmdResults");
      let cmdIdx = 0;

      function openCmd() {
        cmdModal.classList.add("open");
        cmdInput.value = "";
        renderCmdList("");
        setTimeout(() => cmdInput.focus(), 20);
      }

      function closeCmd() {
        cmdModal.classList.remove("open");
      }

      function renderCmdList(q) {
        q = q.trim().toLowerCase();
        const matches = POSTS.filter(
          (p) =>
            !q ||
            p.title.toLowerCase().includes(q) ||
            (p.ex || "").toLowerCase().includes(q) ||
            (p.body || "").toLowerCase().includes(q) ||
            (p.tags || []).some((t) => t.toLowerCase().includes(q))
        ).slice(0, 8);

        cmdIdx = 0;
        if (!matches.length) {
          cmdResults.innerHTML = `<div style="padding:24px;text-align:center;color:var(--md-sys-color-outline);font:400 13px var(--font-mono)">No matching field notes found.</div>`;
          return;
        }
        cmdResults.innerHTML = matches
          .map(
            (p, i) => `
            <button class="cmd-item${i === 0 ? " selected" : ""}" data-href="/entry/${encodeURIComponent(p.slug)}/">
              <div>
                <span class="cmd-item-title">${esc(p.title)}</span>
                <span class="cmd-item-sub">${fmt(p.date)} · ${(p.tags || []).map((t) => "#" + esc(t)).join(" ")}</span>
              </div>
              <span class="ms-icon" style="color:var(--md-sys-color-outline)">Subdirectory_arrow_left</span>
            </button>`
          )
          .join("");

        cmdResults.querySelectorAll(".cmd-item").forEach((btn) => {
          btn.addEventListener("click", () => {
            closeCmd();
            navigate(btn.dataset.href);
          });
        });
      }

      $("#cmdBtn").addEventListener("click", openCmd);
      $("#cmdClose").addEventListener("click", closeCmd);
      cmdModal.addEventListener("click", (e) => {
        if (e.target === cmdModal) closeCmd();
      });
      cmdInput.addEventListener("input", (e) => renderCmdList(e.target.value));

      window.addEventListener("keydown", (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
          e.preventDefault();
          cmdModal.classList.contains("open") ? closeCmd() : openCmd();
          return;
        }
        if (cmdModal.classList.contains("open")) {
          const items = [...cmdResults.querySelectorAll(".cmd-item")];
          if (e.key === "Escape") closeCmd();
          else if (e.key === "ArrowDown" && items.length) {
            e.preventDefault();
            cmdIdx = (cmdIdx + 1) % items.length;
            items.forEach((el, i) => el.classList.toggle("selected", i === cmdIdx));
          } else if (e.key === "ArrowUp" && items.length) {
            e.preventDefault();
            cmdIdx = (cmdIdx - 1 + items.length) % items.length;
            items.forEach((el, i) => el.classList.toggle("selected", i === cmdIdx));
          } else if (e.key === "Enter" && items[cmdIdx]) {
            e.preventDefault();
            closeCmd();
            navigate(items[cmdIdx].dataset.href);
          }
          return;
        }
        const tag = (document.activeElement && document.activeElement.tagName) || "";
        if (!/INPUT|TEXTAREA|SELECT/.test(tag) && e.key.toLowerCase() === "t") {
          toggleTheme();
        }
      });

      function navigate(url) {
        history.pushState(null, "", url);
        route();
      }

      document.addEventListener("click", (e) => {
        const a = e.target.closest("a[data-nav]");
        if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        e.preventDefault();
        navigate(a.getAttribute("href"));
      });

      function route() {
        const h = location.hash;
        if (h.startsWith("#/")) {
          const upgraded = h === "#/" ? "/" : h.slice(1).replace(/\/?$/, "/");
          history.replaceState(null, "", upgraded);
        }

        const p = location.pathname;
        if (!p.startsWith("/archive")) {
          currentTag = null;
          searchQuery = "";
        }

        if (p.startsWith("/about")) renderAbout();
        else if (p.startsWith("/archive")) renderArchive();
        else if (p.startsWith("/entry/")) {
          const slug = decodeURIComponent(p.replace(/^\/entry\/|\/$/g, ""));
          renderPost(slug);
        } else {
          renderHome();
        }
        window.scrollTo(0, 0);
      }

      window.addEventListener("popstate", route);
      window.addEventListener("hashchange", route);

      (async function () {
        let posts = null;
        try {
          posts = await fetchPosts();
        } catch (_) {
          posts = collectSamples();
        }
        POSTS = posts.filter((p) => !p.draft).sort((a, b) => b.dateMs - a.dateMs);
        route();
      })();
    </script>
  </body>
</html>
