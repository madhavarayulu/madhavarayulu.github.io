<script type="text/markdown" data-slug="why-cairn">
---
title: Why Cairn
date: 2026-01-09
tags: notes
---

Above the treeline the trail stops being a trail. It becomes a suggestion — rock, fog, the occasional patch of gravel that might be a path. What keeps you from wandering off is a pile of stones somebody stacked before you arrived.

Nobody owns a cairn. Nobody collects a fee. A stranger you will never meet spent twenty minutes of their one life balancing rocks so that you, specifically, would not get lost.

That seemed like the right shape for a blog.

So this is a cairn too — smaller, slower, made of words instead of granite. Field notes, gotchas, half-finished thoughts, stacked one on top of another as they come. If one of them ever marks the trail for you, the pile has done its job.

> The next storm will knock some of it down. That is fine. That is what stones are for — restacking.
</script>

<script type="text/markdown" data-slug="the-hold-nobody-applied">
---
title: The hold nobody applied
date: 2026-01-22
tags: AP, gotchas
verified: 25B
---

An AP invoice sat on hold for eleven days. The hold said *price mismatch*, the buyer swore the price was right, and everyone had better things to do than argue with a checkbox.

The invoice was fine. The purchase order was fine. The mismatch was three weeks old, on a different line entirely — a receipt booked against line 2 instead of line 3, quietly, by someone rushing on a Friday. The matching engine doesn't hold grudges; it holds arithmetic. It was comparing the right numbers, just not the numbers anyone was looking at.

The lesson generalizes: **when a hold makes no sense, stop auditing the invoice and start auditing the history.** Match review first, receipts second, tolerances last — the hold names the symptom, never the scene of the accident.

Eleven days of an unpaid supplier for a thirty-minute correction. Someone should have left a marker about this. So — marker left.
</script>

<script type="text/markdown" data-slug="reading-release-notes-like-a-field-guide">
---
title: Reading release notes like a field guide
date: 2026-02-08
tags: releases
---

Every quarter Oracle ships a release, and every quarter most teams experience it as a hundred-page document that is somehow both mandatory and optional reading. It doesn't have to be read like a document. It reads like a field guide: you are not looking for everything, you are looking for what moved in *your* terrain.

Three passes, twenty minutes:

- **Your modules only.** Search for the ones you own — GL, AP, AR, FA — and skip the rest without guilt.
- **Red getters.** Most features arrive switched off; the red pages in the feature list are the ones that change behavior without asking. Those are yours.
- **One test per catch.** Anything that touches your flow gets a sandbox check before the update hits the real trail. One test, not a project.

The teams surprised by quarterly updates were never surprised by the notes. They just never walked the ground before the weather changed.

<script>
const CONFIG = {
  owner:  "madhavarayulu",
  repo:   "madhavarayulu.github.io",
  branch: "main",
  title:  "Cairn",
  name:   "Madhava Rayulu",
  linkedin: "https://www.linkedin.com/in/madhavarayulu",

  about: `I work as an Oracle Fusion Finance functional consultant. Most of my days are spent inside large, living systems — configurations, releases, edge cases, and the quiet places where process and reality diverge.

This site is a small collection of notes that survive contact with that work. Some are practical: configuration walkthroughs, quarterly release notes, troubleshooting stories. Some are smaller observations. Client names and confidential details stay behind; the lessons that can travel are allowed to leave.`
};

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const fmt = s => {
  const d = new Date(s);
  return isNaN(d) ? (s || '—') : d.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
};
const yr = s => { const d = new Date(s); return isNaN(d) ? '—' : d.getFullYear(); };

function excerpt(md, n = 165){
  const t = md.replace(/^\s*---[\s\S]*?---/, '')
    .replace(/```[\s\S]*?```/g, ' ')
    .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
    .replace(/[#>*_`~]/g, ' ')
    .replace(/\s+/g, ' ').trim();
  return t.length > n ? t.slice(0, n).replace(/\s+\S*$/,'') + '…' : t;
}

function parsePost(raw, slug){
  raw = String(raw).replace(/^\uFEFF/, '').replace(/^\s+/, '');
  const meta = {title: slug, date: '', tags: [], draft: false, series: '', part: 0, verified: ''};
  let body = raw;
  const m = raw.match(/^---\r?\n([\s\S]*?)\r?\n---\s*(\n|$)/);
  if(m){
    body = raw.slice(m[0].length);
    m[1].split(/\r?\n/).forEach(line => {
      const kv = line.match(/^(\w+)\s*:\s*(.*)$/); if(!kv) return;
      const k = kv[1].toLowerCase(), v = kv[2].trim();
      if(k === 'title') meta.title = v;
      else if(k === 'date') meta.date = v;
      else if(k === 'tags') meta.tags = v.split(',').map(s => s.trim()).filter(Boolean);
      else if(k === 'draft') meta.draft = /^(true|yes|1)$/i.test(v);
      else if(k === 'series') meta.series = v;
      else if(k === 'part') meta.part = parseInt(v,10) || 0;
      else if(k === 'verified') meta.verified = v;
    });
  }
  return {
    slug, ...meta,
    dateMs: meta.date ? (new Date(meta.date).getTime() || 0) : 0,
    ex: excerpt(body),
    body: body.trim(),
  };
}

const collectSamples = () =>
  [...document.querySelectorAll('script[type="text/markdown"]')]
    .map(el => parsePost(el.textContent, el.dataset.slug));

async function fetchFromGitHub(){
  const {owner, repo, branch} = CONFIG;
  const api = `https://api.github.com/repos/${owner}/${repo}/git/trees/${branch}?recursive=1`;
  const r = await fetch(api);
  if(!r.ok) throw new Error('github ' + r.status);
  const j = await r.json();
  const paths = ((j || {}).tree || [])
    .filter(t => t.type === 'blob' && /^posts\/[^/]+\.md$/.test(t.path))
    .map(t => t.path);
  if(!paths.length) throw new Error('no posts');
  const base = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/`;
  return Promise.all(paths.map(async path => {
    const text = await (await fetch(base + path)).text();
    return parsePost(text, path.slice(6, -3));
  }));
}

const view = $('#view'), toastEl = $('#toast'), header = $('#header');
let POSTS = [], currentTag = null, searchQuery = "";

function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.classList.remove('show'), 2000);
}
function setActive(page){
  const a = $('#nav-archive'), t = $('#nav-about');
  if(a) a.className = page === 'archive' ? 'active' : '';
  if(t) t.className = page === 'about'   ? 'active' : '';
}
const metaLine = p =>
  `Nº ${pad(p.no)} · ${fmt(p.date)}` + (p.verified ? ` · <span class="vfy">● Verified on ${esc(p.verified)}</span>` : '');

window.addEventListener('scroll', () => {
  header.classList.toggle('scrolled', window.scrollY > 8);
}, {passive: true});

function renderHome(){
  setActive('home');
  document.title = CONFIG.title;
  const latest = POSTS[0];
  if(!latest){
    view.innerHTML = '<div class="label">Field notes</div><p class="empty">The first stone lands soon.</p>';
    return;
  }
  const recent = POSTS.slice(0, 10);
  const list = recent.map(p =>
    `<a class="item" href="#/entry/${encodeURIComponent(p.slug)}">` +
      `<div class="item-title">${esc(p.title)}</div>` +
      `<div class="item-ex">${esc(p.ex)}</div>` +
      `<div class="item-date">Nº ${pad(p.no)} · ${fmt(p.date)}</div>` +
    `</a>`).join('');

  view.innerHTML =
    `<div class="hero">
      <div class="label">Latest</div>
      <h1><a href="#/entry/${encodeURIComponent(latest.slug)}">${esc(latest.title)}</a></h1>
      <div class="meta">${metaLine(latest)}</div>
      <p class="excerpt">${esc(latest.ex)}</p>
      <a class="btn" href="#/entry/${encodeURIComponent(latest.slug)}">Read entry →</a>
    </div>
    <div class="list-label">Recent markers</div>
    ${list}` +
    (POSTS.length > 10 ? `<p style="margin-top:28px"><a href="#/archive" style="color:var(--text2)">The whole pile →</a></p>` : '');
}

function renderArchive(){
  setActive('archive');
  document.title = `The Pile · ${CONFIG.title}`;

  const allTags = [...new Set(POSTS.flatMap(p => p.tags || []))].sort();
  let filtered = POSTS;
  if(currentTag) filtered = filtered.filter(p => (p.tags || []).includes(currentTag));
  if(searchQuery.trim()){
    const q = searchQuery.toLowerCase();
    filtered = filtered.filter(p =>
      p.title.toLowerCase().includes(q) ||
      p.ex.toLowerCase().includes(q) ||
      (p.tags || []).some(t => t.toLowerCase().includes(q)));
  }

  const years = {};
  filtered.forEach(p => { const y = yr(p.date); (years[y] = years[y] || []).push(p); });
  const sortedYears = Object.keys(years).sort((a,b) => b - a);

  let list = '';
  if(!filtered.length){
    list = `<p class="empty">No markers match.</p>`;
  } else {
    sortedYears.forEach(y => {
      list += `<div class="year">${y}</div>`;
      years[y].forEach(p => {
        const tags = (p.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('');
        list += `<a class="item" href="#/entry/${encodeURIComponent(p.slug)}">` +
          `<div class="item-title">${esc(p.title)}</div>` +
          `<div class="item-ex">${esc(p.ex)}</div>` +
          `<div class="item-date">Nº ${pad(p.no)} · ${fmt(p.date)}</div>` +
          (tags ? `<div class="item-tags">${tags}</div>` : '') +
        `</a>`;
      });
    });
  }

  const tagBtns = allTags.map(t =>
    `<button class="filter-tag${currentTag === t ? ' active' : ''}" data-tag="${esc(t)}">${esc(t)}</button>`).join('');

  view.innerHTML =
    `<div class="label">The Pile · ${pad(POSTS.length)} markers</div>
    <input class="search-box" id="search" type="search" placeholder="Search the pile..." value="${esc(searchQuery)}">
    ${allTags.length ? `<div class="filter-tags">${tagBtns}</div>` : ''}
    ${list}`;

  const si = document.getElementById('search');
  si.addEventListener('input', e => {
    searchQuery = e.target.value;
    renderArchive();
    const el = document.getElementById('search');
    if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  });
  view.querySelectorAll('.filter-tag').forEach(b =>
    b.addEventListener('click', () => {
      currentTag = currentTag === b.dataset.tag ? null : b.dataset.tag;
      renderArchive();
    }));
}

function renderPost(slug){
  setActive('home');
  const p = POSTS.find(x => x.slug === slug);
  if(!p){
    view.innerHTML = `<p class="empty">This stone isn't in the pile.</p><a class="back" href="#/">← Field notes</a>`;
    return;
  }
  document.title = `${p.title} · ${CONFIG.title}`;
  const clean = location.origin + '/entry/' + encodeURIComponent(p.slug) + '/';
  const body = window.marked ? marked.parse(p.body) : '<p>' + esc(p.body) + '</p>';

  let series = '';
  if(p.series){
    const parts = POSTS.filter(x => x.series === p.series)
      .sort((a,b) => (a.part || a.dateMs) - (b.part || b.dateMs));
    series = `<section class="series"><div class="list-label">Series — ${esc(p.series)}</div>` +
      parts.map((x, ix) =>
        `<a class="srow${x.slug === p.slug ? ' cur' : ''}" href="#/entry/${encodeURIComponent(x.slug)}">` +
        `<span class="s-no">Part ${x.part || ix+1}</span><br><span class="s-t">${esc(x.title)}</span>` +
        (x.slug === p.slug ? '<span class="s-here">you are here</span>' : '') + `</a>`).join('') +
      `</section>`;
  }

  const i = POSTS.indexOf(p);
  const newer = POSTS[i-1], older = POSTS[i+1];

  view.innerHTML =
    `<a class="back" href="#/">← Field notes</a>
    <div class="meta">${metaLine(p)}</div>
    <h1 class="art-title">${esc(p.title)}</h1>
    <div class="prose">${body}</div>
    <div class="share">
      <span class="share-label">Leave a marker —</span>
      <button class="share-btn" id="copy-link" data-url="${esc(clean)}">Copy link</button>
      <a class="share-btn" target="_blank" rel="noopener" href="https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(clean)}">Carry it to LinkedIn</a>
    </div>
    ${series}
    <nav class="pn">
      ${newer ? `<a href="#/entry/${encodeURIComponent(newer.slug)}"><span class="dir">Newer</span><span class="pt">${esc(newer.title)}</span></a>` : ''}
      ${older ? `<a href="#/entry/${encodeURIComponent(older.slug)}"><span class="dir">Older</span><span class="pt">${esc(older.title)}</span></a>` : ''}
    </nav>`;

  document.getElementById('copy-link').addEventListener('click', async e => {
    const url = e.currentTarget.dataset.url || location.href;
    try{ await navigator.clipboard.writeText(url); }
    catch(_){
      const ta = document.createElement('textarea');
      ta.value = url; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
    }
    toast('Link copied');
  });
}

function renderAbout(){
  setActive('about');
  document.title = `Trailhead · ${CONFIG.title}`;
  const md = (CONFIG.about || '').replace(/^\s+/, '');
  const html = window.marked ? marked.parse(md) : '<p>' + esc(md) + '</p>';
  view.innerHTML = `
    <h1 class="art-title">${esc(CONFIG.name)}</h1>
    <div class="prose">${html}</div>
    <div class="disclaimer">
      This is an independent site. It is not affiliated with, endorsed by, or reviewed by Oracle. Product names are used for identification only. Nothing here constitutes official documentation or advice.
    </div>`;
}

function route(){
  const h = location.hash || '#/';
  if(h.indexOf('#/archive') !== 0){ currentTag = null; searchQuery = ''; }
  try{
    if(h.indexOf('#/trailhead') === 0) renderAbout();
    else if(h.indexOf('#/archive') === 0) renderArchive();
    else if(h.indexOf('#/entry/') === 0) renderPost(decodeURIComponent(h.slice(8)));
    else renderHome();
  }catch(err){
    view.innerHTML = `<p class="empty">A stone cracked in transit: ${esc(err.message)}</p><a class="back" href="#/">← Field notes</a>`;
  }
  window.scrollTo(0, 0);
}
addEventListener('hashchange', route);

(async function(){
  document.title = CONFIG.title;

  view.innerHTML = '<div class="loading">Stacking stones…</div>';
  let posts = null;
  try{ posts = await fetchFromGitHub(); }
  catch(_){ /* fall back to samples */ }
  if(!posts) posts = collectSamples();

  POSTS = posts.filter(p => !p.draft).sort((a,b) => b.dateMs - a.dateMs);
  POSTS.forEach((p,i) => p.no = POSTS.length - i);
  route();
})();
</script>
</body>
</html>
