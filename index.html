<script type="text/markdown" data-slug="why-cairn">
---
title: Why Cairn
date: 2026-01-09
tags: notes
---

Above the treeline the trail stops being a trail. It becomes a suggestion — rock, fog, the occasional patch of gravel that might be a path. What keeps you from wandering off is a pile of stones somebody stacked before you arrived.

Nobody owns a cairn. Nobody collects a fee. A stranger you will never meet spent twenty minutes of their one life balancing rocks so that you, specifically, would not get lost.

That seemed like the right shape for a blog.

So this is a cairn too — smaller, slower, made of words instead of granite. Field notes, gotchas, half-finished thoughts, stacked one on top of another as they come. If one of them ever marks the trail for you, the pile has done its job.

> The next storm will knock some of it down. That is fine. That is what stones are for — restacking.
</script>

<script type="text/markdown" data-slug="the-hold-nobody-applied">
---
title: The hold nobody applied
date: 2026-01-22
tags: AP, gotchas
---

An AP invoice sat on hold for eleven days. The hold said *price mismatch*, the buyer swore the price was right, and everyone had better things to do than argue with a checkbox.

The invoice was fine. The purchase order was fine. The mismatch was three weeks old, on a different line entirely — a receipt booked against line 2 instead of line 3, quietly, by someone rushing on a Friday. The matching engine doesn't hold grudges; it holds arithmetic. It was comparing the right numbers, just not the numbers anyone was looking at.

The lesson generalizes: **when a hold makes no sense, stop auditing the invoice and start auditing the history.** Match review first, receipts second, tolerances last — the hold names the symptom, never the scene of the accident.

Eleven days of an unpaid supplier for a thirty-minute correction. Someone should have left a marker about this. So — marker left.
</script>

<script type="text/markdown" data-slug="reading-release-notes-like-a-field-guide">
---
title: Reading release notes like a field guide
date: 2026-02-08
tags: releases
---

Every quarter Oracle ships a release, and every quarter most teams experience it as a hundred-page document that is somehow both mandatory and optional reading. It doesn't have to be read like a document. It reads like a field guide: you are not looking for everything, you are looking for what moved in *your* terrain.

Three passes, twenty minutes:

- **Your modules only.** Search for the ones you own — GL, AP, AR, FA — and skip the rest without guilt.
- **Red getters.** Most features arrive switched off; the red pages in the feature list are the ones that change behavior without asking. Those are yours.
- **One test per catch.** Anything that touches your flow gets a sandbox check before the update hits the real trail. One test, not a project.

The teams surprised by quarterly updates were never surprised by the notes. They just never walked the ground before the weather changed.
</script>

<script>
/* ╔═══════════════════════════════════════════════════════════╗

const CONFIG = {
  owner:  "madhavarayulu",
  repo:   "madhavarayulu.github.io",
  branch: "main",

  title:    "Cairn",
  estYear:  2026,

What stacks up here: configuration walkthroughs, quarterly release notes read like field guides, and the small gotchas that cost an afternoon and shouldn't cost anyone else one. Client names and numbers stay behind; the lessons leave with me.

**Why *Cairn*?** Above the treeline, the trail disappears into rock and fog, and what keeps you on the path is a pile of stones stacked by whoever walked it first. Nobody owns a cairn. Nobody collects a fee. That seemed like the right shape for a blog.`,

/* Post front-matter (top of each /posts/*.md):
     title / date / tags — any tags you write appear automatically
     (match exactly as written: "AP" and "ap" are two different tags) /
     draft: true / series: Name + part: 1          */

/* ---------- helpers ---------- */
const $   = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const fmtDate = s => {
  const d = new Date(s);
  return isNaN(d) ? (s || '—')
    : d.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
};
const chip = (t,on) => `<button class="chip${on?' on':''}" data-tag="${esc(t)}">${esc(t)}</button>`;

function excerpt(md, n = 170){
  const t = md.replace(/^\s*---[\s\S]*?---/, '')
    .replace(/```[\s\S]*?```/g, ' ')
    .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
    .replace(/[#>*_`~]/g, ' ')
    .replace(/\s+/g, ' ').trim();
  return t.length > n ? t.slice(0, n).replace(/\s+\S*$/,'') + '…' : t;
}

/* ---------- markdown → posts ---------- */
function parsePost(raw, slug){
  raw = String(raw).replace(/^\uFEFF/, '').replace(/^\s+/, '');
  const meta = {title: slug, date: '', tags: [], draft: false, series: '', part: 0};
  let body = raw;
  const m = raw.match(/^---\r?\n([\s\S]*?)\r?\n---\s*(\n|$)/);
  if(m){
    body = raw.slice(m[0].length);
    m[1].split(/\r?\n/).forEach(line => {
      const kv = line.match(/^(\w+)\s*:\s*(.*)$/); if(!kv) return;
      const k = kv[1].toLowerCase(), v = kv[2].trim();
      if(k === 'title')      meta.title  = v;
      else if(k === 'date')  meta.date   = v;
      else if(k === 'tags')  meta.tags   = v.split(',').map(s => s.trim()).filter(Boolean);
      else if(k === 'draft') meta.draft  = /^(true|yes|1)$/i.test(v);
      else if(k === 'series')meta.series = v;
      else if(k === 'part')  meta.part   = parseInt(v,10) || 0;
    });
  }
  const d = new Date(meta.date);
  return {
    slug, ...meta,
    dateMs: meta.date ? (d.getTime() || 0) : 0,
    yr: meta.date && !isNaN(d) ? d.getFullYear() : '—',
    ex: excerpt(body),
    body: body.trim(),
  };
}
const collectSamples = () =>
  [...document.querySelectorAll('script[type="text/markdown"]')]
    .map(el => parsePost(el.textContent, el.dataset.slug));

/* ---------- GitHub source (public, keyless) ---------- */
async function fetchFromGitHub(){
  const {owner, repo, branch} = CONFIG;
  const api = `https://api.github.com/repos/${owner}/${repo}/git/trees/${branch}?recursive=1`;
  const r = await fetch(api);
  if(!r.ok) throw new Error('github ' + r.status);
  const j = await r.json();
  const paths = ((j || {}).tree || [])
    .filter(t => t.type === 'blob' && /^posts\/[^/]+\.md$/.test(t.path))
    .map(t => t.path);
  if(!paths.length) throw new Error('no posts');
  const base = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/`;
  return Promise.all(paths.map(async path => {
    const text = await (await fetch(base + path)).text();
    return parsePost(text, path.slice(6, -3));
  }));
}

/* ---------- the cairn, at its two rendered scales ---------- */
const homeMark = `
  <svg class="home-mark" viewBox="0 0 512 512" aria-hidden="true">
    <ellipse cx="256" cy="452" rx="142" ry="11" fill="#E2D9C4"/>
    <ellipse cx="250" cy="398" rx="118" ry="44" fill="#E7E0CF"/>
    <ellipse cx="258" cy="324" rx="94"  ry="37" fill="#E4DCC9"/>
    <ellipse cx="248" cy="258" rx="72"  ry="30" fill="#E1D8C4"/>
    <ellipse cx="256" cy="200" rx="52"  ry="23" fill="#DED4BF"/>
    <ellipse cx="256" cy="160" rx="36"  ry="16" fill="#DDBCA3" transform="rotate(-8 256 160)"/>
  </svg>`;
const miniMark = `
  <svg class="mini-mark" viewBox="0 0 512 512" aria-hidden="true">
    <ellipse class="stone" style="animation-delay:0ms"   cx="250" cy="398" rx="118" ry="44" fill="#2E2A24"/>
    <ellipse class="stone" style="animation-delay:70ms"  cx="258" cy="324" rx="94"  ry="37" fill="#403A31"/>
    <ellipse class="stone" style="animation-delay:140ms" cx="248" cy="258" rx="72"  ry="30" fill="#524A3E"/>
    <ellipse class="stone" style="animation-delay:210ms" cx="256" cy="200" rx="52"  ry="23" fill="#645A4B"/>
    <ellipse class="stone" style="animation-delay:280ms" cx="256" cy="160" rx="36"  ry="16" fill="#C1502E" transform="rotate(-8 256 160)"/>
  </svg>`;

/* ---------- state & chrome ---------- */
const CHUNK = 10;
const state = { published: [], filter: null, isArticle: false, shown: CHUNK };
const view = $('#view'), pbar = $('#pbar'), totop = $('#totop');

function toast(msg, icon = 'check'){
  $('#toastMsg').textContent = msg;
  $('#toast').querySelector('svg, i').outerHTML = `<i data-lucide="${icon}"></i>`;
  const t = $('#toast');
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(() => t.classList.remove('show'), 2400);
  window.lucide && lucide.createIcons();
}
function setNav(which){
  const h = $('#navHome'), t = $('#navTrail');
  which === 'home'      ? h.setAttribute('aria-current','page') : h.removeAttribute('aria-current');
  which === 'trailhead' ? t.setAttribute('aria-current','page') : t.removeAttribute('aria-current');
}
function setChrome(){
  totop.classList.toggle('show', scrollY > 600);
  if(!state.isArticle){ pbar.style.width = '0'; return; }
  const h = document.documentElement;
  const max = h.scrollHeight - innerHeight;
  pbar.style.width = (max > 0 ? Math.min(100, scrollY / max * 100) : 0) + '%';
}
addEventListener('scroll', setChrome, {passive:true});
totop.addEventListener('click', () => scrollTo({top:0, behavior:'smooth'}));

function clearFilter(){
  state.filter = null;
  state.shown  = CHUNK;
}
function goHomeFresh(e){
  if(!state.filter) return;
  e.preventDefault();
  clearFilter();
  if(location.hash.startsWith('#/entry/') || location.hash.startsWith('#/trailhead')) location.hash = '#/';
  else route();
}
 $('#navHome').addEventListener('click', goHomeFresh);
 $('#brandLink').addEventListener('click', goHomeFresh);

function renderError(err){
  state.isArticle = false; setNav('home');
  document.title = CONFIG.title;
  const msg = esc((err && err.message) ? err.message : String(err));
  view.innerHTML = `
    <p class="nf-big">A stone cracked in transit.</p>
    <p class="empty">Rendering failed: ${msg}. If you recently edited the file, undo that change; otherwise re-copy the original and hard-refresh (Ctrl+Shift-R).</p>
    <a class="back" href="#/"><i data-lucide="arrow-left"></i>Field notes</a>`;
  window.lucide && lucide.createIcons();
}

/* ---------- home : lead features the newest, index holds all ---------- */
const rowHTML = p => `
  <a class="row" href="#/entry/${encodeURIComponent(p.slug)}">
    <span class="no">Nº ${pad(p.no)}</span>
    <span class="mid">
      <span class="tt">${esc(p.title)}</span>
      <span class="ex">${esc(p.ex)}</span>
    </span>
    <span class="mt">${fmtDate(p.date)}</span>
  </a>`;

function groupRows(rows){
  const years = [...new Set(rows.map(r => r.yr))];
  if(years.length < 2) return rows.map(rowHTML).join('');
  let out = '', cur = null;
  for(const r of rows){
    if(r.yr !== cur){ cur = r.yr; out += `<div class="yr">${cur}</div>`; }
    out += rowHTML(r);
  }
  return out;
}

function renderHome(){
  state.isArticle = false; setNav('home');
  document.title = CONFIG.title;

  const pub  = state.published;
  const list = state.filter ? pub.filter(p => p.tags.includes(state.filter)) : pub;
  const tags = [...new Set(pub.flatMap(p => p.tags))].sort();
  const f    = (!state.filter) ? pub[0] : null;
  const vis  = list.slice(0, state.shown);

  let lead = '';
  if(f){
    lead = `
    <p class="plaque">Latest entry</p>
    <article class="lead">
      <a class="ttl" href="#/entry/${encodeURIComponent(f.slug)}">${esc(f.title)}</a>
      <div class="meta"><span>Nº ${pad(f.no)}</span><span>${fmtDate(f.date)}</span></div>
      <p class="ex">${esc(f.ex)}</p>
      <a class="more" href="#/entry/${encodeURIComponent(f.slug)}">Read the entry <i data-lucide="arrow-right"></i></a>
    </article>`;
  }

  const bar = `<div class="tagbar list">${tags.map(t => chip(t, state.filter === t)).join('')}</div>`;

  let archive = '';
  if(list.length){
    archive = `
    ${bar}
    <div class="list-label">${state.filter
      ? `<button class="clearbtn" id="clearFilter">Tagged — ${esc(state.filter)} ✕</button> · ${pad(list.length)}`
      : `All entries · ${pad(list.length)}`}</div>
    ${groupRows(vis)}
    ${list.length > vis.length ? `<button class="more" id="moreBtn">Older entries <i data-lucide="arrow-down"></i></button>` : ''}`;
  } else if(state.filter){
    archive = `${bar}
      <div class="list-label"><button class="clearbtn" id="clearFilter">Tagged — ${esc(state.filter)} ✕</button> · 00</div>
      <p class="empty">Nothing tagged “${esc(state.filter)}” yet.</p>`;
  } else {
    archive = `<p class="empty">The first stone lands soon.</p>`;
  }

  view.innerHTML = `${homeMark}${lead}${archive}`;
  window.lucide && lucide.createIcons();
}

/* ---------- article ---------- */
function renderPost(slug){
  const p = state.published.find(x => x.slug === slug);
  if(!p){
    state.isArticle = false; setNav('home');
    document.title = CONFIG.title;
    view.innerHTML = `
      <p class="nf-big">This stone isn't in the pile.</p>
      <a class="back" href="#/"><i data-lucide="arrow-left"></i>Field notes</a>`;
    window.lucide && lucide.createIcons();
    return;
  }
  state.isArticle = true; setNav('home');
  document.title = `${p.title} · ${CONFIG.title}`;

  const i = state.published.indexOf(p);
  const newer = state.published[i-1], older = state.published[i+1];
  const body = window.marked ? marked.parse(p.body) : '<p>' + esc(p.body) + '</p>';

  let series = '';
  if(p.series){
    const parts = state.published
      .filter(x => x.series === p.series)
      .sort((a,b) => (a.part || a.dateMs) - (b.part || b.dateMs));
    series = `
    <section class="series">
      <div class="list-label">Series — ${esc(p.series)} · ${pad(parts.length)} parts</div>
      ${parts.map((x, ix) => `
        <a class="srow${x.slug === p.slug ? ' cur' : ''}" href="#/entry/${encodeURIComponent(x.slug)}">
          <span class="pno">Part ${x.part || ix+1}</span>
          <span class="t">${esc(x.title)}</span>
          ${x.slug === p.slug ? '<span class="mt">You are here</span>' : ''}
        </a>`).join('')}
    </section>`;
  }

  view.innerHTML = `
    <a class="back" href="#/"><i data-lucide="arrow-left"></i>Field notes</a>
    <article class="art">
      <div class="meta">Nº ${pad(p.no)} · ${fmtDate(p.date)}</div>
      <h1 class="ttl">${esc(p.title)}</h1>
      <div class="rule"></div>
      ${p.tags.length ? `<div class="tagbar page">${p.tags.map(t => chip(t,false)).join('')}</div>` : ''}
      <div class="prose dropcap">${body}</div>
      <div class="share">
        ${miniMark}
        <span class="lbl">Leave a marker —</span>
        <button class="chip" id="copyLinkBtn">Copy link</button>
        <a class="chip" target="_blank" rel="noopener" href="https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(location.href)}">Carry it to LinkedIn</a>
      </div>
      ${series}
      <nav class="pn">
        ${newer ? `<a href="#/entry/${encodeURIComponent(newer.slug)}"><span class="dir">Newer</span><span class="t">${esc(newer.title)}</span></a>` : ''}
        ${older ? `<a href="#/entry/${encodeURIComponent(older.slug)}"><span class="dir">Older</span><span class="t">${esc(older.title)}</span></a>` : ''}
      </nav>
    </article>`;
  window.lucide && lucide.createIcons();
}

/* ---------- trailhead : your name is the headline ---------- */
function renderAbout(){
  state.isArticle = false; setNav('trailhead');
  document.title = `Trailhead · ${CONFIG.title}`;
  const md = (CONFIG.about || '').replace(/^\s+/, '');
  const html = window.marked ? marked.parse(md) : '<p>' + esc(md) + '</p>';
  view.innerHTML = `
    <article class="art">
      <h1 class="ttl">${esc(CONFIG.name)}</h1>
      <div class="rule"></div>
      <div class="prose dropcap">${html}</div>
    </article>`;
  window.lucide && lucide.createIcons();
}

/* ---------- routing ---------- */
function route(){
  const h = location.hash;
  try{
    if(h.startsWith('#/trailhead')) renderAbout();
    else{
      const m = h.match(/^#\/entry\/(.+)$/);
      if(m) renderPost(decodeURIComponent(m[1]));
      else renderHome();
    }
  }catch(err){ renderError(err); }
  scrollTo(0, 0);
  setChrome();
}
addEventListener('hashchange', route);

/* ---------- delegated clicks: clear-filter, more, copy, tags ---------- */
view.addEventListener('click', async e => {
  const cf = e.target.closest('#clearFilter');
  if(cf){ clearFilter(); route(); return; }
  const more = e.target.closest('#moreBtn');
  if(more){
    const y = scrollY;
    state.shown += CHUNK;
    renderHome();
    scrollTo(0, y);
    return;
  }
  const cb = e.target.closest('#copyLinkBtn');
  if(cb){
    const url = location.href;
    try{ await navigator.clipboard.writeText(url); }
    catch(_){
      const t = document.createElement('textarea');
      t.value = url; document.body.appendChild(t); t.select();
      document.execCommand('copy'); t.remove();
    }
    toast('Link copied');
    return;
  }
  const c = e.target.closest('[data-tag]');
  if(!c) return;
  state.filter = c.classList.contains('on') ? null : c.dataset.tag;
  state.shown = CHUNK;
  if(location.hash.startsWith('#/entry/') || location.hash.startsWith('#/trailhead')) location.hash = '#/';
  else route();
});

/* ---------- boot ---------- */
(async function init(){
  document.title = CONFIG.title;
  $('#brandName').innerHTML = esc(CONFIG.title) + (/[.!?:]$/.test(CONFIG.title) ? '' : '<span class="dot">.</span>');
  $('#footLeft').textContent = `First stone, ${CONFIG.estYear}`;
  $('#footLi').href = CONFIG.linkedin;

  view.innerHTML = '<div class="loading">Stacking stones<span>…</span></div>';
  window.lucide && lucide.createIcons();

  let posts = null;
  if(CONFIG.owner && CONFIG.repo){
    try{ posts = await fetchFromGitHub(); }
    catch(_){ toast("Couldn't reach the repository — showing sample entries", 'wifi-off'); }
  }
  if(!posts) posts = collectSamples();

  state.published = posts.filter(p => !p.draft).sort((a,b) => b.dateMs - a.dateMs);
  // Nº counts from the first stone: oldest = 01, newest = total.
  state.published.forEach((p,i) => p.no = state.published.length - i);
  route();
})();
</script>
