    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <style>
      :root {
        --bg: #141110;
        --elev: #1c1815;
        --elev2: #241f19;
        --line: #2b261f;
        --line2: #3e362b;
        --text: #f0eadd;
        --text2: #a89e8f;
        --muted: #71685a;
        --accent: #c1502e;
        --accent-hi: #da6437;
        --disp: "Fraunces", Georgia, serif;
        --serif: "Newsreader", Georgia, "Times New Roman", serif;
        --mono: "Spline Sans Mono", ui-monospace, "SF Mono", Menlo, monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font: 400 16px/1.65 var(--serif);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background: radial-gradient(1000px 520px at 50% -160px, rgba(193, 80, 46, 0.055), transparent 70%);
      }
      .grain {
        position: fixed;
        inset: 0;
        z-index: 70;
        pointer-events: none;
        opacity: 0.05;
        background-image: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='180'%20height='180'%3E%3Cfilter%20id='g'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='0.75'%20numOctaves='2'%20stitchTiles='stitch'/%3E%3CfeColorMatrix%20values='0%200%200%200%201%200%200%200%200%201%200%200%200%200%201%200.3%200.3%200.3%200%200'/%3E%3C/filter%3E%3Crect%20width='180'%20height='180'%20filter='url(%23g)'/%3E%3C/svg%3E");
      }
      ::selection {
        background: var(--accent);
        color: #fff4ea;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 2px;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button {
        font-family: inherit;
        color: inherit;
      }

      #progress-bar {
        position: fixed;
        top: 0;
        left: 0;
        height: 2px;
        width: 0;
        background: var(--accent);
        z-index: 95;
        transition: width 0.1s linear;
      }
      #progress-bar::after {
        content: "";
        position: absolute;
        right: -2px;
        top: -2.5px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent-hi);
        box-shadow: 0 0 0 3px rgba(193, 80, 46, 0.15);
        opacity: 0;
        transition: opacity 0.25s;
      }
      #progress-bar.on::after {
        opacity: 1;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 50;
        background: rgba(20, 17, 16, 0.86);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid transparent;
        transition: border-color 0.25s;
      }
      header.scrolled {
        border-bottom-color: var(--line);
      }
      .header-inner {
        max-width: 960px;
        margin: 0 auto;
        padding: 0 24px;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .logo {
        font: 600 21px/1 var(--disp);
        font-optical-sizing: auto;
        letter-spacing: -0.02em;
      }
      .logo span {
        color: var(--accent);
      }
      header nav {
        display: flex;
      }
      header nav a {
        font: 500 11.5px/1 var(--mono);
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--text2);
        margin-left: 26px;
        padding: 6px 0;
        transition: color 0.15s;
      }
      header nav a:hover {
        color: var(--text);
      }
      header nav a.active {
        color: var(--accent-hi);
      }

      main {
        position: relative;
        z-index: 1;
      }
      .wrap {
        max-width: 960px;
        margin: 0 auto;
        padding: 0 24px;
      }

      /* ---- the marginalia grid ---- */
      .page-grid {
        display: grid;
        grid-template-columns: minmax(0, 640px) 240px;
        column-gap: 32px;
      }
      .main-col {
        grid-column: 1;
        min-width: 0;
      }
      .margin-col {
        grid-column: 2;
        min-width: 0;
      }
      .m-sticky {
        position: sticky;
        top: 92px;
      }
      .m-label {
        font: 500 10.5px/1 var(--mono);
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 14px;
      }
      .only-mobile {
        display: none;
      }

      .label {
        font: 500 11px/1 var(--mono);
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .meta-line {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 9px;
        font: 400 12px/1.5 var(--mono);
        color: var(--text2);
        letter-spacing: 0.03em;
      }
      .meta-line .mdot {
        color: var(--muted);
      }
      .vfy {
        color: var(--accent);
      }

      /* ---- home ---- */
      .hero {
        padding: 56px 0 60px;
        border-bottom: 1px solid var(--line);
      }
      .hero .meta-line {
        margin-bottom: 18px;
      }
      .hero-title {
        font: 600 clamp(30px, 4.5vw, 44px) / 1.1 var(--disp);
        font-optical-sizing: auto;
        letter-spacing: -0.02em;
        margin: 16px 0 14px;
        text-wrap: balance;
      }
      .hero-title a {
        transition: color 0.15s;
      }
      .hero-title a:hover {
        color: var(--accent-hi);
      }
      .hero-ex {
        color: var(--text2);
        font-size: 17px;
        line-height: 1.68;
        margin-bottom: 26px;
      }
      .read-btn {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        font: 500 12px/1 var(--mono);
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--text);
        border: 1px solid var(--line2);
        border-radius: 999px;
        padding: 13px 22px;
        transition:
          border-color 0.2s,
          color 0.2s;
      }
      .read-btn svg {
        width: 14px;
        height: 14px;
        transition: transform 0.2s;
      }
      .read-btn:hover {
        border-color: var(--accent);
        color: var(--accent-hi);
      }
      .read-btn:hover svg {
        transform: translateX(3px);
      }

      .list-head {
        padding: 36px 0 4px;
      }
      .item {
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr) auto;
        column-gap: 18px;
        row-gap: 2px;
        padding: 22px 14px;
        margin: 0 -14px;
        border-bottom: 1px solid var(--line);
        border-radius: 12px;
        transition: background 0.2s;
      }
      .item:hover {
        background: rgba(240, 234, 221, 0.025);
      }
      .item-no {
        font: 500 12px/1 var(--mono);
        color: var(--muted);
        letter-spacing: 0.05em;
        padding-top: 5px;
        transition: color 0.2s;
      }
      .item:hover .item-no {
        color: var(--accent);
      }
      .item-main {
        display: block;
        min-width: 0;
      }
      .item-title {
        display: block;
        font: 500 20px/1.35 var(--disp);
        font-optical-sizing: auto;
        letter-spacing: -0.01em;
        transition: color 0.2s;
      }
      .item:hover .item-title {
        color: var(--accent-hi);
      }
      .item-ex {
        display: block;
        color: var(--text2);
        font-size: 14.5px;
        line-height: 1.62;
        margin-top: 5px;
      }
      .item-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 12px;
        margin-top: 10px;
        font: 400 11px/1.4 var(--mono);
        color: var(--muted);
        letter-spacing: 0.04em;
      }
      .item-meta .vfy {
        font-size: 11px;
      }
      .item-date {
        font: 400 11.5px/1 var(--mono);
        color: var(--muted);
        letter-spacing: 0.04em;
        justify-self: end;
        padding-top: 6px;
        white-space: nowrap;
        transition: color 0.2s;
      }
      .item:hover .item-date {
        color: var(--text2);
      }
      .pile-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 34px 0 8px;
        font: 500 11.5px/1 var(--mono);
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--text2);
        transition: color 0.2s;
      }
      .pile-link svg {
        width: 14px;
        height: 14px;
        transition: transform 0.2s;
      }
      .pile-link:hover {
        color: var(--accent-hi);
      }
      .pile-link:hover svg {
        transform: translateX(3px);
      }

      /* ---- margin residents ---- */
      /* figure margins (home, trailhead): captions center under the pile */
      .m-home {
        padding-top: 40px;
        text-align: center;
      }
      .about-margin {
        padding-top: 30px;
        text-align: center;
      }
      .m-home .cairn,
      .ab-ca .cairn {
        width: 100%;
        height: auto;
        display: block;
      }
      .cairn-cap {
        font: 400 11.5px/1.6 var(--mono);
        color: var(--muted);
        letter-spacing: 0.04em;
        margin-top: 2px;
        min-height: 2.4em;
      }
      .cairn-hint {
        font: 400 10.5px/1.6 var(--mono);
        color: var(--muted);
        opacity: 0.8;
        letter-spacing: 0.03em;
        margin-top: 8px;
      }
      .m-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 20px;
        font: 500 11px/1 var(--mono);
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--text2);
        transition: color 0.2s;
      }
      .m-link svg {
        width: 13px;
        height: 13px;
        transition: transform 0.2s;
      }
      .m-link:hover {
        color: var(--accent-hi);
      }
      .m-link:hover svg {
        transform: translateX(3px);
      }

      .m-note {
        border-left: 1px solid var(--line2);
        padding-left: 18px;
        display: flex;
        flex-direction: column;
        gap: 13px;
      }
      .nrow {
        display: grid;
        grid-template-columns: 56px minmax(0, 1fr);
        gap: 10px;
        align-items: baseline;
      }
      .nk {
        font: 500 10px/1.4 var(--mono);
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .nv {
        font: 400 12.5px/1.55 var(--mono);
        color: var(--text2);
        overflow-wrap: break-word;
      }
      .m-series {
        margin-top: 32px;
      }
      .m-series .m-label {
        margin-bottom: 4px;
      }
      .m-series .srow {
        display: block;
        padding: 10px 0;
        border-bottom: 1px dashed var(--line);
      }
      .m-series .srow:last-child {
        border-bottom: none;
      }
      .m-series .s-no {
        font: 400 10px/1 var(--mono);
        color: var(--muted);
        letter-spacing: 0.08em;
      }
      .m-series .s-t {
        display: block;
        font: 500 14px/1.4 var(--disp);
        font-optical-sizing: auto;
        margin-top: 4px;
        transition: color 0.18s;
      }
      .m-series .srow:hover .s-t,
      .m-series .srow.cur .s-t {
        color: var(--accent-hi);
      }
      .m-series .srow.cur .s-no {
        color: var(--accent-hi);
      }
      .m-series .s-here {
        display: none;
      }
      .m-share {
        margin-top: 32px;
        display: flex;
        flex-direction: column;
      }
      .m-share .share-btn {
        width: 100%;
        justify-content: flex-start;
      }

      /* ---- archive ---- */
      .page-head {
        padding: 52px 0 4px;
      }
      .page-title {
        font: 600 clamp(32px, 5vw, 46px) / 1.1 var(--disp);
        font-optical-sizing: auto;
        letter-spacing: -0.02em;
        margin: 14px 0 10px;
      }
      .page-sub {
        font: 400 12px/1.6 var(--mono);
        color: var(--muted);
        letter-spacing: 0.05em;
      }
      .searchline {
        display: flex;
        align-items: center;
        gap: 11px;
        margin: 30px 0 16px;
        padding: 11px 2px;
        border-bottom: 1px solid var(--line2);
        transition: border-color 0.2s;
      }
      .searchline:focus-within {
        border-bottom-color: var(--accent);
      }
      .searchline svg {
        width: 15px;
        height: 15px;
        color: var(--muted);
        flex: none;
      }
      .searchline input {
        flex: 1;
        background: none;
        border: none;
        outline: none;
        color: var(--text);
        font: 400 15.5px/1.4 var(--serif);
      }
      .searchline input::placeholder {
        color: var(--muted);
      }
      .filter-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 0 0 14px;
      }
      .ftag {
        font: 400 11.5px/1 var(--mono);
        letter-spacing: 0.05em;
        padding: 7px 14px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: none;
        color: var(--text2);
        cursor: pointer;
        transition:
          border-color 0.18s,
          color 0.18s,
          background 0.18s;
      }
      .ftag:hover {
        border-color: var(--line2);
        color: var(--text);
      }
      .ftag.active {
        border-color: var(--accent);
        color: var(--accent-hi);
        background: rgba(193, 80, 46, 0.09);
      }
      .pile-margin {
        padding-top: 92px;
      }
      .mtag {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 10px;
        width: 100%;
        background: none;
        border: none;
        padding: 9px 2px;
        text-align: left;
        font: 400 12.5px/1.4 var(--mono);
        letter-spacing: 0.02em;
        color: var(--text2);
        cursor: pointer;
        transition: color 0.15s;
      }
      .mtag:hover {
        color: var(--text);
      }
      .mtag.active,
      .mtag.active .cnt {
        color: var(--accent-hi);
      }
      .mtag .cnt {
        font-size: 10.5px;
        color: var(--muted);
        flex: none;
      }
      .year {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 34px 0 6px;
      }
      .year b {
        font: 500 12.5px/1 var(--mono);
        letter-spacing: 0.14em;
        color: var(--text2);
      }
      .year span {
        font: 400 10.5px/1 var(--mono);
        color: var(--muted);
        letter-spacing: 0.05em;
      }
      .year::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--line);
      }

      /* ---- entry / about ---- */
      .art-margin {
        padding-top: 80px;
      }
      .back {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 40px;
        font: 500 11px/1 var(--mono);
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--muted);
        transition: color 0.2s;
      }
      .back:hover {
        color: var(--accent-hi);
      }
      .mm-slot {
        margin-top: 26px;
        margin-bottom: 16px;
      }
      .mshare-slot {
        margin-top: 40px;
      }
      .art-title {
        font: 600 clamp(31px, 5.4vw, 46px) / 1.12 var(--disp);
        font-optical-sizing: auto;
        letter-spacing: -0.02em;
        margin-top: 14px;
        text-wrap: balance;
      }
      .about-top {
        margin-top: 46px;
      }
      .about-cairn {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 6px 0 36px;
      }
      .about-cairn .cairn {
        width: min(240px, 64vw);
      }
      .prose {
        margin-top: 36px;
        font-size: 17.5px;
        line-height: 1.8;
      }
      .prose p {
        margin: 0 0 1.3em;
      }
      .entry-prose > p:first-child::first-letter {
        font-family: var(--disp);
        font-weight: 600;
        font-size: 3.4em;
        line-height: 0.8;
        float: left;
        padding: 0.06em 0.14em 0 0;
        color: var(--accent);
      }
      .prose h2,
      .prose h3 {
        font-family: var(--disp);
        font-optical-sizing: auto;
        font-weight: 600;
        letter-spacing: -0.01em;
        line-height: 1.3;
      }
      .prose h2 {
        font-size: 1.42em;
        margin: 2em 0 0.7em;
      }
      .prose h2::before {
        content: "";
        display: block;
        width: 24px;
        height: 2px;
        background: var(--accent);
        opacity: 0.9;
        margin-bottom: 0.6em;
      }
      .prose h3 {
        font-size: 1.18em;
        margin: 1.7em 0 0.55em;
      }
      .prose a {
        color: var(--accent-hi);
        text-decoration: underline;
        text-underline-offset: 3px;
        text-decoration-thickness: 1px;
        transition: color 0.15s;
      }
      .prose a:hover {
        color: var(--text);
      }
      .prose blockquote {
        margin: 1.7em 0;
        padding: 0.15em 0 0.15em 1.4em;
        border-left: 2px solid var(--accent);
        color: var(--text2);
        font-style: italic;
        font-size: 1.05em;
      }
      .prose ul,
      .prose ol {
        margin: 0 0 1.3em;
        padding-left: 1.5em;
      }
      .prose li {
        margin: 0.45em 0;
      }
      .prose li::marker {
        color: var(--accent);
      }
      .prose code {
        font-family: var(--mono);
        font-size: 0.82em;
        background: var(--elev2);
        padding: 3px 7px;
        border-radius: 6px;
      }
      .prose pre {
        background: var(--elev);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 18px 20px;
        overflow-x: auto;
        margin: 0 0 1.4em;
        line-height: 1.6;
      }
      .prose pre code {
        background: none;
        padding: 0;
        font-size: 0.85em;
      }
      .prose img {
        max-width: 100%;
        height: auto;
        display: block;
        border-radius: 12px;
        border: 1px solid var(--line);
        margin: 2.2em 0;
      }
      .prose hr {
        border: none;

      /* the cairn stones */
      @keyframes stdrop {

      .cairn .st {

      @media (max-width: 880px) {

    <main>

          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">

            <ellipse cx="12.4" cy="12.9" rx="5.8" ry="2.1" fill="#524A3E" />
            <ellipse cx="11.8" cy="9.1" rx="3.9" ry="1.8" fill="#645A4B" />
            <ellipse cx="12.2" cy="5.7" rx="2.6" ry="1.4" fill="#C1502E" />

          Madhava Rayulu
        </span>

    <div class="toast" id="toast">Link copied</div>

    <script type="text/markdown" data-slug="why-cairn">
      ---
      title: Why Cairn
      date: 2026-01-09
      tags: notes
      ---
      Above the treeline the trail stops being a trail. It becomes a suggestion — rock, fog, the occasional patch of gravel that might be a path. What keeps you from wandering off is a pile of stones somebody stacked before you arrived.
      Nobody owns a cairn. Nobody collects a fee. A stranger you will never meet spent twenty minutes of their one life balancing rocks so that you, specifically, would not get lost.
      That seemed like the right shape for a blog.
      So this is a cairn too — smaller, slower, made of words instead of granite. Field notes, gotchas, half-finished thoughts, stacked one on top of another as they come. If one of them ever marks the trail for you, the pile has done its job.
      > The next storm will knock some of it down. That is fine. That is what stones are for — restacking.
    </script>

    <script>
      const CONFIG = {
        owner: "madhavarayulu",
        repo: "madhavarayulu.github.io",
        branch: "main",
        title: "Cairn",
        name: "Madhava Rayulu",
      };

      const $ = (s) => document.querySelector(s);
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]
        );
      const fmt = (s) => {
        const d = new Date(s);
        return isNaN(d) ? s || "—" : d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
      };
      const yr = (s) => {
        const d = new Date(s);
        return isNaN(d) ? "—" : d.getFullYear();
      };
      const rt = (t) => {
        const w = String(t || "")
          .trim()
          .split(/\s+/)
          .filter(Boolean).length;
        return Math.max(1, Math.round(w / 220)) + " min read";
      };

      function excerpt(md, n = 165) {
        const t = md
          .replace(/^\s*---[\s\S]*?---/, "")
          .replace(/```[\s\S]*?```/g, " ")
          .replace(/\[([^\]]*)\]\([^)]*\)/g, "$1")
          .replace(/[#>*_`~]/g, " ")
          .replace(/\s+/g, " ")
          .trim();
        return t.length > n ? t.slice(0, n).replace(/\s+\S*$/, "") + "…" : t;
      }

      function parsePost(raw, slug) {
        raw = String(raw)
          .replace(/^\uFEFF/, "")
          .replace(/^\s+/, "");
        const meta = { title: slug, date: "", tags: [], draft: false, series: "", part: 0, verified: "" };
        let body = raw;
        const m = raw.match(/^---\r?\n([\s\S]*?)\r?\n---\s*(\n|$)/);
        if (m) {
          body = raw.slice(m[0].length);
          m[1].split(/\r?\n/).forEach((line) => {
            const kv = line.match(/^(\w+)\s*:\s*(.*)$/);
            if (!kv) return;
            const k = kv[1].toLowerCase(),
              v = kv[2].trim();
            if (k === "title") meta.title = v;
            else if (k === "date") meta.date = v;
            else if (k === "tags")
              meta.tags = v
                .split(",")
                .map((s) => s.trim())
                .filter(Boolean);
            else if (k === "draft") meta.draft = /^(true|yes|1)$/i.test(v);
            else if (k === "series") meta.series = v;
            else if (k === "part") meta.part = parseInt(v, 10) || 0;
            else if (k === "verified") meta.verified = v;
          });
        }
        return {
          slug,
          ...meta,
          dateMs: meta.date ? new Date(meta.date).getTime() || 0 : 0,
          ex: excerpt(body),
          body: body.trim(),
        };
      }

      const collectSamples = () =>
        [...document.querySelectorAll('script[type="text/markdown"]')].map((el) =>
          parsePost(el.textContent, el.dataset.slug)
        );

      async function fetchPosts() {
        try {
          const res = await fetch("/posts.json");
          if (res.ok) {
            const data = await res.json();
            return data.map((p) => ({
              ...p,
              dateMs: p.date ? new Date(p.date).getTime() || 0 : 0,
              ex: p.excerpt,
              body: p.raw,
            }));
          }
        } catch (e) {}

        const { owner, repo, branch } = CONFIG;
        const api = `https://api.github.com/repos/${owner}/${repo}/git/trees/${branch}?recursive=1`;
        const r = await fetch(api);
        if (!r.ok) throw new Error("github " + r.status);
        const j = await r.json();
        const paths = ((j || {}).tree || [])
          .filter((t) => t.type === "blob" && /^posts\/[^/]+\.md$/.test(t.path))
          .map((t) => t.path);
        if (!paths.length) throw new Error("no posts");
        const base = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/`;
        return Promise.all(
          paths.map(async (path) => {
            const text = await (await fetch(base + path)).text();
            return parsePost(text, path.slice(6, -3));
          })
        );
      }

      const view = $("#view"),
        toastEl = $("#toast"),
        header = $("#header"),
        progressBar = $("#progress-bar");
      let POSTS = [],
        currentTag = null,
        searchQuery = "";
      const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;

      function toast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add("show");
        clearTimeout(toast._t);
        toast._t = setTimeout(() => toastEl.classList.remove("show"), 2000);
      }
      function setActive(page) {
        const a = $("#nav-archive"),
          t = $("#nav-about");
        if (a) a.className = page === "archive" ? "active" : "";
        if (t) t.className = page === "about" ? "active" : "";
      }

      window.addEventListener(
        "scroll",
        () => {
          header.classList.toggle("scrolled", window.scrollY > 8);
          const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
          const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
          const p = height > 0 ? (winScroll / height) * 100 : 0;
          progressBar.style.width = p + "%";
          progressBar.classList.toggle("on", p > 0.5);
        },
        { passive: true }
      );

      /* ---------- the cairn: each stone is a post ---------- */
      function cairnSVG(entries, o) {
        o = o || {};
        const uid = o.uid || "c" + Math.random().toString(36).slice(2, 7);
        const RAMP = ["#282320", "#2E2A24", "#403A31", "#524A3E", "#645A4B"];
        const shown = entries.slice(0, 6).reverse(); // oldest of the shown at the base
        const n = shown.length;
        if (!n) return "";
        const S = [
          { rx: 98, ry: 26, cy: 236, dx: 2, t: 0 },
          { rx: 82, ry: 24, cy: 197, dx: -3, t: -2 },
          { rx: 67, ry: 21, cy: 162, dx: 3, t: 2 },
          { rx: 51, ry: 18, cy: 131, dx: -2, t: -2.5 },
          { rx: 37, ry: 14, cy: 105, dx: 2, t: 3 },
          { rx: 26, ry: 11, cy: 84, dx: -2, t: -8 },
        ];
        const slots = [];
        if (n === 1) slots.push({ rx: 62, ry: 21, cy: 233, dx: 0, t: -5 });
        else {
          slots.push(S[0]);
          for (let i = 1; i < n - 1; i++) slots.push(S[i]);
          slots.push(S[5]);
        }

        const defs = [],
          out = [];
        defs.push(
          '<filter id="' +
            uid +
            'b2" x="-60%" y="-300%" width="220%" height="700%"><feGaussianBlur stdDeviation="2.6"/></filter>'
        );
        defs.push(
          '<filter id="' +
            uid +
            'b6" x="-50%" y="-500%" width="200%" height="1100%"><feGaussianBlur stdDeviation="5"/></filter>'
        );
        out.push(
          '<ellipse class="gnd" cx="160" cy="266" rx="116" ry="10" fill="#000" opacity=".5" filter="url(#' +
            uid +
            'b6)"/>'
        );
        out.push(
          '<ellipse cx="160" cy="264" rx="66" ry="5" fill="#C1502E" opacity=".14" filter="url(#' + uid + 'b2)"/>'
        );

        for (let i = 0; i < n; i++) {
          const s = slots[i],
            cap = i === n - 1,
            cx = 160 + s.dx,
            cy = s.cy;
          const col = cap ? "#C1502E" : RAMP[Math.min(i, 4)];
          if (i > 0)
            out.push(
              '<ellipse cx="' +
                cx +
                '" cy="' +
                (cy + s.ry - 2) +
                '" rx="' +
                (s.rx * 0.92).toFixed(1) +
                '" ry="6" fill="#000" opacity=".3" filter="url(#' +
                uid +
                'b2)"/>'
            );
          defs.push(
            '<radialGradient id="' +
              uid +
              "h" +
              i +
              '" cx=".36" cy=".18" r="1"><stop offset="0" stop-color="#FFE9CE" stop-opacity="' +
              (cap ? ".5" : ".35") +
              '"/><stop offset=".6" stop-color="#FFE9CE" stop-opacity="0"/></radialGradient>'
          );
          defs.push(
            '<linearGradient id="' +
              uid +
              "o" +
              i +
              '" x1="0" y1="0" x2="0" y2="1"><stop offset=".55" stop-color="#0B0705" stop-opacity="0"/><stop offset="1" stop-color="#0B0705" stop-opacity=".42"/></linearGradient>'
          );
          defs.push(
            '<clipPath id="' +
              uid +
              "c" +
              i +
              '"><ellipse cx="' +
              cx +
              '" cy="' +
              cy +
              '" rx="' +
              s.rx +
              '" ry="' +
              s.ry +
              '"/></clipPath>'
          );
          const stroke = cap
            ? 'stroke="#7A2F17" stroke-opacity=".55" stroke-width="1"'
            : 'stroke="#0B0705" stroke-opacity=".35" stroke-width="1"';
          out.push(
            '<g class="st" data-slug="' +
              esc(shown[i].slug) +
              '" data-title="' +
              esc(shown[i].title) +
              '" tabindex="0" role="link" aria-label="' +
              esc(shown[i].title) +
              '" style="animation-delay:' +
              i * 70 +
              'ms">' +
              '<g transform="rotate(' +
              s.t +
              " " +
              cx +
              " " +
              cy +
              ')">' +
              '<ellipse class="stbody" cx="' +
              cx +
              '" cy="' +
              cy +
              '" rx="' +
              s.rx +
              '" ry="' +
              s.ry +
              '" fill="' +
              col +
              '" ' +
              stroke +
              "/>" +
              '<g clip-path="url(#' +
              uid +
              "c" +
              i +
              ')">' +
              '<ellipse cx="' +
              cx +
              '" cy="' +
              cy +
              '" rx="' +
              s.rx +
              '" ry="' +
              s.ry +
              '" fill="url(#' +
              uid +
              "h" +
              i +
              ')"/>' +
              '<ellipse cx="' +
              cx +
              '" cy="' +
              cy +
              '" rx="' +
              s.rx +
              '" ry="' +
              s.ry +
              '" fill="url(#' +
              uid +
              "o" +
              i +
              ')"/>' +
              "</g></g></g>"
          );
        }
        return (
          '<svg class="cairn" viewBox="0 0 320 282" role="group" aria-label="Recent entries, stacked as stones"><defs>' +
          defs.join("") +
          "</defs>" +
          out.join("") +
          "</svg>"
        );
      }

      function bindCairn(root, cap) {
        if (!root) return;
        const reset = () => {
          if (cap) cap.textContent = cap.dataset.def || "";
        };
        const show = (g) => {
          if (cap && g) cap.textContent = "↳ " + g.dataset.title;
        };
        root.addEventListener("mouseover", (e) => {
          const g = e.target.closest("g.st");
          if (g) show(g);
        });
        root.addEventListener("mouseleave", reset);
        root.addEventListener("focusin", (e) => {
          const g = e.target.closest("g.st");
          if (g) show(g);
        });
        root.addEventListener("focusout", reset);
        root.addEventListener("click", (e) => {
          const g = e.target.closest("g.st");
          if (g && g.dataset.slug) location.hash = "#/entry/" + encodeURIComponent(g.dataset.slug);
        });
        root.addEventListener("keydown", (e) => {
          const g = e.target.closest("g.st");
          if (g && (e.key === "Enter" || e.key === " ")) {
            e.preventDefault();
            if (g.dataset.slug) location.hash = "#/entry/" + encodeURIComponent(g.dataset.slug);
          }
        });
      }

      /* ---------- shared bits ---------- */
      const ARROW =
        '<svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 6l6 6-6 6"/></svg>';
      const SEARCH =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path stroke-linecap="round" d="M20 20l-3.5-3.5"/></svg>';

      function itemHTML(p, no) {
        const tags = (p.tags || []).map((t) => "#" + esc(t)).join(" · ");
        return (
          '<a class="item" href="#/entry/' +
          encodeURIComponent(p.slug) +
          '">' +
          '<span class="item-no">' +
          String(no).padStart(2, "0") +
          "</span>" +
          '<span class="item-main">' +
          '<span class="item-title">' +
          esc(p.title) +
          "</span>" +
          '<span class="item-ex">' +
          esc(p.ex || "") +
          "</span>" +
          '<span class="item-meta">' +
          (p.verified ? '<span class="vfy">● verified</span>' : "") +
          (tags ? "<span>" + tags + "</span>" : "") +
          "</span>" +
          "</span>" +
          '<span class="item-date">' +
          fmt(p.date) +
          "</span>" +
          "</a>"
        );
      }

      /* ---------- one adaptive share pill ----------
   touch devices  → native share sheet (label: "Share")
   mouse/trackpad → clipboard copy      (label: "Copy link") */
      const CAN_SHARE = typeof navigator.share === "function" && matchMedia("(pointer: coarse)").matches;

      function sharePill(url, title) {
        return (
          '<button class="share-btn js-share" data-url="' +
          esc(url) +
          '" data-title="' +
          esc(title) +
          '">' +
          (CAN_SHARE ? "Share" : "Copy link") +
          "</button>"
        );
      }

      function bindShare() {
        document.querySelectorAll(".js-share").forEach((b) =>
          b.addEventListener("click", async () => {
            const url = b.dataset.url || location.href;
            if (CAN_SHARE) {
              try {
                await navigator.share({ title: b.dataset.title || document.title, url });
              } catch (_) {}
              return;
            }
            try {
              await navigator.clipboard.writeText(url);
            } catch (_) {
              const ta = document.createElement("textarea");
              ta.value = url;
              document.body.appendChild(ta);
              ta.select();
              document.execCommand("copy");
              ta.remove();
            }
            const o = b.textContent;
            b.textContent = "✓ Copied";
            setTimeout(() => (b.textContent = o), 2000);
          })
        );
      }

      /* ---------- views ---------- */
      function renderHome() {
        setActive("");
        document.title = CONFIG.title + " | Oracle Fusion Finance Field Notes";
        const latest = POSTS[0];
        if (!latest) {
          view.innerHTML =
            '<div class="page-grid"><div class="main-col">' +
            '<div class="label" style="padding-top:48px">Field notes</div>' +
            '<p class="empty">The first stone lands soon.</p></div></div>';
          return;
        }
        const rest = POSTS.slice(1, 8);
        const list = rest.map((p, i) => itemHTML(p, POSTS.length - i - 1)).join("");
        const oldest = POSTS[POSTS.length - 1];
        const capDef =
          POSTS.length + (POSTS.length === 1 ? " stone" : " stones") + " · stacked since " + yr(oldest.date);

        view.innerHTML =
          '<div class="page-grid">' +
          '<div class="main-col">' +
          '<div class="hero">' +
          '<div class="label">Latest entry</div>' +
          '<h1 class="hero-title"><a href="#/entry/' +
          encodeURIComponent(latest.slug) +
          '">' +
          esc(latest.title) +
          "</a></h1>" +
          '<div class="meta-line"><span>' +
          fmt(latest.date) +
          '</span><span class="mdot">·</span><span>' +
          rt(latest.body) +
          "</span>" +
          (latest.verified ? '<span class="vfy">● Verified on ' + esc(latest.verified) + "</span>" : "") +
          "</div>" +
          '<p class="hero-ex">' +
          esc(latest.ex) +
          "</p>" +
          '<a class="read-btn" href="#/entry/' +
          encodeURIComponent(latest.slug) +
          '">Read entry ' +
          ARROW +
          "</a>" +
          "</div>" +
          (rest.length ? '<div class="list-head"><div class="label">Earlier entries</div></div>' + list : "") +
          (POSTS.length > 8 ? '<a class="pile-link" href="#/archive">View the full pile ' + ARROW + "</a>" : "") +
          "</div>" +
          '<aside class="margin-col m-home"><div class="m-sticky">' +
          '<div class="hc">' +
          cairnSVG(POSTS, { uid: "hc" }) +
          "</div>" +
          '<div class="cairn-cap" id="cairnCap" data-def="' +
          esc(capDef) +
          '">' +
          esc(capDef) +
          "</div>" +
          '<div class="cairn-hint">Each stone is an entry — click one to open it.</div>' +
          "</div></aside>" +
          "</div>";

        bindCairn(document.querySelector(".hc"), document.getElementById("cairnCap"));
      }

      function renderArchive() {
        setActive("archive");
        document.title = "The Pile · " + CONFIG.title;

        const allTags = [...new Set(POSTS.flatMap((p) => p.tags || []))].sort();
        let filtered = POSTS;
        if (currentTag) filtered = filtered.filter((p) => (p.tags || []).includes(currentTag));
        const q = searchQuery.trim().toLowerCase();
        if (q)
          filtered = filtered.filter(
            (p) =>
              p.title.toLowerCase().includes(q) ||
              p.ex.toLowerCase().includes(q) ||
              (p.tags || []).some((t) => t.toLowerCase().includes(q))
          );

        const years = {};
        filtered.forEach((p) => {
          const y = yr(p.date);
          (years[y] = years[y] || []).push(p);
        });
        const ys = Object.keys(years).sort((a, b) => b.localeCompare(a));

        let list = "";
        if (!filtered.length) {
          list = '<p class="empty">No stones match. Try another word.</p>';
        } else {
          ys.forEach((y, ix) => {
            list +=
              '<div class="year"' +
              (ix === 0 ? ' style="margin-top:26px"' : "") +
              "><b>" +
              y +
              "</b><span>" +
              years[y].length +
              (years[y].length === 1 ? " stone" : " stones") +
              "</span></div>";
            years[y].forEach((p) => {
              list += itemHTML(p, POSTS.length - POSTS.indexOf(p));
            });
          });
        }

        const tagCount = (t) => POSTS.filter((p) => (p.tags || []).includes(t)).length;
        const mtagBtns =
          '<button class="mtag' +
          (!currentTag ? " active" : "") +
          '" data-tag="">All entries<span class="cnt">' +
          POSTS.length +
          "</span></button>" +
          allTags
            .map(
              (t) =>
                '<button class="mtag' +
                (currentTag === t ? " active" : "") +
                '" data-tag="' +
                esc(t) +
                '">' +
                "<span># " +
                esc(t) +
                '</span><span class="cnt">' +
                tagCount(t) +
                "</span></button>"
            )
            .join("");
        const chipBtns = allTags
          .map(
            (t) =>
              '<button class="ftag' +
              (currentTag === t ? " active" : "") +
              '" data-tag="' +
              esc(t) +
              '">' +
              esc(t) +
              "</button>"
          )
          .join("");

        view.innerHTML =
          '<div class="page-grid">' +
          '<div class="main-col">' +
          '<div class="page-head"><div class="label">Archive</div>' +
          '<h1 class="page-title">The Pile</h1>' +
          '<div class="page-sub">' +
          POSTS.length +
          (POSTS.length === 1 ? " entry" : " entries") +
          " · sorted newest first</div></div>" +
          '<div class="searchline">' +
          SEARCH +
          '<input id="search" type="search" placeholder="Search the pile…" value="' +
          esc(searchQuery) +
          '" autocomplete="off"></div>' +
          '<div class="only-mobile"><div class="filter-tags">' +
          chipBtns +
          "</div></div>" +
          '<div class="list">' +
          list +
          "</div>" +
          "</div>" +
          '<aside class="margin-col only-desktop pile-margin"><div class="m-sticky">' +
          '<div class="m-label">Filter by tag</div>' +
          mtagBtns +
          "</div></aside>" +
          "</div>";

        const si = $("#search");
        si.addEventListener("input", (e) => {
          searchQuery = e.target.value;
          renderArchive();
          const el = $("#search");
          if (el) {
            el.focus();
            el.setSelectionRange(el.value.length, el.value.length);
          }
        });
        view.querySelectorAll(".ftag,.mtag").forEach((b) =>
          b.addEventListener("click", () => {
            currentTag = currentTag === b.dataset.tag ? null : b.dataset.tag;
            renderArchive();
          })
        );
      }

      function renderPost(slug) {
        setActive("");
        const p = POSTS.find((x) => x.slug === slug);
        if (!p) {
          view.innerHTML =
            '<div class="page-grid"><div class="main-col">' +
            '<p class="empty">Entry not found — it may have been restacked.</p>' +
            '<a class="back" href="#/">← Field notes</a></div></div>';
          return;
        }
        document.title = p.title + " · " + CONFIG.title;
        const clean = location.origin + "/entry/" + encodeURIComponent(p.slug) + "/";
        const body = window.marked ? marked.parse(p.body) : "<p>" + esc(p.body) + "</p>";
        const i = POSTS.indexOf(p);

        let srows = "",
          seriesLabel = "";
        if (p.series) {
          const parts = POSTS.filter((x) => x.series === p.series).sort(
            (a, b) => (a.part || a.dateMs) - (b.part || b.dateMs)
          );
          seriesLabel = "Series — " + esc(p.series);
          srows = parts
            .map(
              (x, ix) =>
                '<a class="srow' +
                (x.slug === p.slug ? " cur" : "") +
                '" href="#/entry/' +
                encodeURIComponent(x.slug) +
                '">' +
                '<span class="s-no">Part ' +
                (x.part || ix + 1) +
                "</span>" +
                '<span class="s-t">' +
                esc(x.title) +
                "</span>" +
                (x.slug === p.slug ? '<span class="s-here">you are here</span>' : "") +
                "</a>"
            )
            .join("");
        }
        const seriesMargin = p.series
          ? '<div class="m-series"><div class="m-label">' + seriesLabel + "</div>" + srows + "</div>"
          : "";
        const seriesMobile = p.series
          ? '<div class="only-mobile"><div class="series"><div class="label">' +
            seriesLabel +
            "</div>" +
            srows +
            "</div></div>"
          : "";

        const shareBtns = sharePill(clean, p.title);

        const note =
          '<div class="m-note"><div class="m-label">Field note</div>' +
          '<div class="nrow"><span class="nk">Date</span><span class="nv">' +
          fmt(p.date) +
          "</span></div>" +
          '<div class="nrow"><span class="nk">Read</span><span class="nv">' +
          rt(p.body) +
          "</span></div>" +
          '<div class="nrow"><span class="nk">Stone</span><span class="nv">#' +
          String(POSTS.length - i).padStart(2, "0") +
          " in the pile</span></div>" +
          (p.verified
            ? '<div class="nrow"><span class="nk">Status</span><span class="nv vfy">● Verified on ' +
              esc(p.verified) +
              "</span></div>"
            : "") +
          "</div>";

        const newer = POSTS[i - 1],
          older = POSTS[i + 1];
        view.innerHTML =
          '<div class="page-grid">' +
          '<div class="main-col">' +
          '<a class="back" href="#/">← Field notes</a>' +
          '<div class="only-mobile mm-slot"><div class="meta-line">' +
          "<span>" +
          fmt(p.date) +
          '</span><span class="mdot">·</span><span>' +
          rt(p.body) +
          "</span>" +
          (p.verified
            ? '<span class="mdot">·</span><span class="vfy">● Verified on ' + esc(p.verified) + "</span>"
            : "") +
          "</div></div>" +
          '<h1 class="art-title">' +
          esc(p.title) +
          "</h1>" +
          '<div class="prose entry-prose">' +
          body +
          "</div>" +
          seriesMobile +
          '<div class="only-mobile mshare-slot"><div class="share-row">' +
          shareBtns +
          "</div></div>" +
          '<nav class="nav-row">' +
          (newer
            ? '<a class="nav-link prev" href="#/entry/' +
              encodeURIComponent(newer.slug) +
              '"><span class="nav-label">← Newer</span><span class="nav-title">' +
              esc(newer.title) +
              "</span></a>"
            : "<div></div>") +
          (older
            ? '<a class="nav-link next" href="#/entry/' +
              encodeURIComponent(older.slug) +
              '"><span class="nav-label">Older →</span><span class="nav-title">' +
              esc(older.title) +
              "</span></a>"
            : "<div></div>") +
          "</nav>" +
          "</div>" +
          '<aside class="margin-col only-desktop art-margin"><div class="m-sticky">' +
          note +
          seriesMargin +
          '<div class="m-share">' +
          shareBtns +
          "</div>" +
          "</div></aside>" +
          "</div>";
        bindShare();
      }

      function renderAbout() {
        setActive("about");
        document.title = "Trailhead · " + CONFIG.title;
        const capDef = POSTS.length + (POSTS.length === 1 ? " stone" : " stones") + " and counting";
        const why = POSTS.find((x) => x.slug === "why-cairn");
        const c1 = cairnSVG(POSTS, { uid: "aba" }),
          c2 = cairnSVG(POSTS, { uid: "abb" });

        view.innerHTML =
          '<div class="page-grid">' +
          '<div class="main-col">' +
          '<h1 class="art-title about-top">Trailhead</h1>' +
          '<div class="only-mobile"><div class="about-cairn"><div id="abCairnM">' +
          c2 +
          "</div>" +
          '<div class="cairn-cap" id="abCapM" data-def="' +
          esc(capDef) +
          '">' +
          esc(capDef) +
          "</div>" +
          (why ? '<a class="m-link" href="#/entry/why-cairn">Why “Cairn”? ' + ARROW + "</a>" : "") +
          "</div></div>" +
          '<div class="prose">' +
          "<p>I am an Oracle Fusion Finance functional consultant.</p>" +
          "<p>My work is to bridge the gap between business needs and system capabilities—guiding implementations, designing financial processes, and configuring solutions that work in the real world.</p>" +
          "<p>Cairn is a collection of field notes from that journey. It covers the practical realities of deployments, release cycles, and the edge cases that official documentation misses.</p>" +
          "<p>Client identities remain confidential. The insights, however, are left here for anyone walking the same trail.</p>" +
          "</div>" +
          '<div class="disclaimer">This site is an independent project and is not affiliated with, endorsed by, or sponsored by Oracle Corporation. Oracle and related trademarks are the property of their respective owners. The content provided here is for informational purposes only, based on personal experience, and does not constitute official documentation or professional advice.</div>' +
          "</div>" +
          '<aside class="margin-col only-desktop about-margin"><div class="m-sticky">' +
          '<div id="abCairnD">' +
          c1 +
          "</div>" +
          '<div class="cairn-cap" id="abCapD" data-def="' +
          esc(capDef) +
          '">' +
          esc(capDef) +
          "</div>" +
          (why ? '<a class="m-link" href="#/entry/why-cairn">Why “Cairn”? ' + ARROW + "</a>" : "") +
          "</div></aside>" +
          "</div>";

        bindCairn(document.getElementById("abCairnD"), document.getElementById("abCapD"));
        bindCairn(document.getElementById("abCairnM"), document.getElementById("abCapM"));
      }

      function route() {
        const h = location.hash || "#/";
        if (h.indexOf("#/archive") !== 0) {
          currentTag = null;
          searchQuery = "";
        }
        try {
          if (h.indexOf("#/trailhead") === 0) renderAbout();
          else if (h.indexOf("#/archive") === 0) renderArchive();
          else if (h.indexOf("#/entry/") === 0) renderPost(decodeURIComponent(h.slice(8)));
          else renderHome();
        } catch (err) {
          view.innerHTML =
            '<div class="page-grid"><div class="main-col">' +
            '<p class="empty">Something came loose: ' +
            esc(err.message) +
            "</p>" +
            '<a class="back" href="#/">← Field notes</a></div></div>';
        }
        if (!REDUCE && view.animate)
          view.animate(
            [
              { opacity: 0, transform: "translateY(10px)" },
              { opacity: 1, transform: "none" },
            ],
            { duration: 420, easing: "cubic-bezier(.22,1,.36,1)" }
          );
        window.scrollTo(0, 0);
      }

      addEventListener("hashchange", route);

      (async function () {
        document.title = CONFIG.title;
        let posts = null;
        try {
          posts = await fetchPosts();
        } catch (_) {
          posts = collectSamples();
        }
        POSTS = posts.filter((p) => !p.draft).sort((a, b) => b.dateMs - a.dateMs);
        route();
      })();
    </script>
  </body>
</html>
