<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628">
  <defs>
    <style>
      .bg { fill: #12100e; }
      .brand { font-family: 'Fraunces', Georgia, serif; font-weight: 400; font-size: 42px; fill: #B5AB9C; letter-spacing: -0.02em; }
      .dot { fill: #E06D44; }
      .title { font-family: 'Fraunces', Georgia, serif; font-weight: 400; font-size: 62px; fill: #F2ECE1; letter-spacing: -0.015em; }
      .author { font-family: 'Spline Sans Mono', ui-monospace, Menlo, monospace; font-weight: 400; font-size: 20px; fill: #7E7567; letter-spacing: 0.08em; }
    </style>
    <radialGradient id="bgGlow" cx="50%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#E06D44" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#12100e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="628" class="bg"/>
  <rect width="1200" height="628" fill="url(#bgGlow)"/>

  <text x="90" y="116" class="brand">Cairn<tspan class="dot">.</tspan></text>

  <!--TITLE_BLOCK-->

  <text x="90" y="560" class="author">Madhava Rayulu</text>
</svg>
